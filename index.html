<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#070B18" />
<link rel="icon" type="image/svg+xml" href="./btl-play-icon.svg" />
<title>BTL Live — Gamification de conférence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   BTL Live — Design system (prototype)
   ============================================================ */
:root{
  --bg:#070B18; --bg2:#0C1226; --bg3:#121A38;
  --panel:rgba(255,255,255,.045); --panel2:rgba(255,255,255,.075);
  --stroke:rgba(255,255,255,.10); --stroke2:rgba(255,255,255,.20);
  --txt:#EAF0FF; --muted:#93A2C6; --dim:#5F6C8C;
  --v:#7C5CFF; --c:#22D3EE; --amber:#FFB020; --green:#34D399; --red:#FF5C7A; --pink:#FF6FB5;
  --r:20px; --r2:14px; --r3:10px;
  --shadow:0 20px 60px -16px rgba(0,0,0,.8);
  --f:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fd:"Sora","Inter",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--txt); font-family:var(--f);
  -webkit-font-smoothing:antialiased; min-height:100vh; overflow-x:hidden;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(58vw 58vw at 10% -10%, rgba(124,92,255,.30), transparent 62%),
    radial-gradient(48vw 48vw at 94% 2%, rgba(34,211,238,.17), transparent 62%),
    radial-gradient(70vw 50vw at 50% 112%, rgba(255,111,181,.13), transparent 62%);
}
body::after{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.35;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:64px 64px;
  mask-image:radial-gradient(circle at 50% 30%, #000 0%, transparent 78%);
}
#app{position:relative;z-index:1}
h1,h2,h3,h4{font-family:var(--fd); margin:0; letter-spacing:-.02em; line-height:1.12}
p{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
::selection{background:rgba(124,92,255,.45)}

/* ---------- layout ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 90px}
.wrap.narrow{max-width:560px}
.wrap.mid{max-width:860px}
.row{display:flex;gap:12px;align-items:center}
.row.wrap-row{flex-wrap:wrap}
.row.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.spacer{flex:1}
.mt{margin-top:16px}.mt-s{margin-top:8px}.mt-l{margin-top:26px}
.center{text-align:center}
.muted{color:var(--muted)}.dim{color:var(--dim)}
.tiny{font-size:12px}.small{font-size:13.5px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.hide{display:none!important}

/* ---------- topbar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;backdrop-filter:blur(18px);
  background:linear-gradient(180deg,rgba(7,11,24,.92),rgba(7,11,24,.62));
  border-bottom:1px solid var(--stroke);
}
.topbar-in{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:11px;font-family:var(--fd);font-weight:800;font-size:16px;letter-spacing:-.02em}
.logo{
  width:36px;height:36px;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--v),var(--c)); color:#080D1C;font-weight:900;font-size:14px;
  box-shadow:0 8px 26px -6px rgba(124,92,255,.9); font-family:var(--fd)
}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav a{
  padding:8px 13px;border-radius:11px;font-size:13.5px;font-weight:600;color:var(--muted);
  border:1px solid transparent;transition:.18s
}
.nav a:hover{color:var(--txt);background:var(--panel)}
.nav a.on{color:var(--txt);background:var(--panel2);border-color:var(--stroke2)}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(52,211,153,.7);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.55)}70%{box-shadow:0 0 0 11px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}

/* ---------- card ---------- */
.card{
  background:linear-gradient(180deg,rgba(255,255,255,.062),rgba(255,255,255,.028));
  border:1px solid var(--stroke); border-radius:var(--r); padding:20px;
  box-shadow:var(--shadow); position:relative; overflow:hidden;
}
.card.tight{padding:15px}
.card.flat{box-shadow:none}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-t{font-family:var(--fd);font-weight:700;font-size:16px}
.card.glow::after{
  content:"";position:absolute;inset:0;border-radius:var(--r);pointer-events:none;
  background:radial-gradient(60% 90% at 50% 0%,rgba(124,92,255,.22),transparent 70%)
}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  padding:12px 18px;border-radius:13px;border:1px solid var(--stroke2);
  background:var(--panel2);color:var(--txt);font-weight:650;font-size:14.5px;
  cursor:pointer;transition:.16s;white-space:nowrap
}
.btn:hover{transform:translateY(-1px);background:rgba(255,255,255,.11)}
.btn:active{transform:translateY(0)}
.btn.primary{
  background:linear-gradient(135deg,var(--v),#9C7BFF);border-color:transparent;color:#fff;
  box-shadow:0 14px 34px -12px rgba(124,92,255,1)
}
.btn.primary:hover{background:linear-gradient(135deg,#8B6BFF,#A98CFF)}
.btn.cyan{background:linear-gradient(135deg,#12A6C4,var(--c));border-color:transparent;color:#04222A;font-weight:800}
.btn.amber{background:linear-gradient(135deg,#E29308,var(--amber));border-color:transparent;color:#2A1A00;font-weight:800}
.btn.green{background:linear-gradient(135deg,#12A87B,var(--green));border-color:transparent;color:#04241A;font-weight:800}
.btn.danger{background:rgba(255,92,122,.14);border-color:rgba(255,92,122,.45);color:#FFB7C6}
.btn.ghost{background:transparent}
.btn.sm{padding:8px 13px;font-size:13px;border-radius:11px}
.btn.xs{padding:6px 10px;font-size:12px;border-radius:9px}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

/* ---------- pills / badges ---------- */
.pill{
  display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;
  font-size:12px;font-weight:700;letter-spacing:.02em;
  background:var(--panel2);border:1px solid var(--stroke);color:var(--muted)
}
.pill.v{background:rgba(124,92,255,.18);border-color:rgba(124,92,255,.45);color:#C9B8FF}
.pill.c{background:rgba(34,211,238,.14);border-color:rgba(34,211,238,.4);color:#9BEAF7}
.pill.g{background:rgba(52,211,153,.14);border-color:rgba(52,211,153,.4);color:#8EF0C8}
.pill.a{background:rgba(255,176,32,.15);border-color:rgba(255,176,32,.42);color:#FFD48A}
.pill.r{background:rgba(255,92,122,.15);border-color:rgba(255,92,122,.42);color:#FFB0C0}
.pill.k{background:rgba(255,255,255,.06)}

/* ---------- avatar ---------- */
.av{
  border-radius:50%;display:grid;place-items:center;font-weight:800;flex:0 0 auto;
  background:linear-gradient(135deg,var(--v),var(--c));color:#08101F;overflow:hidden;
  font-family:var(--fd);position:relative
}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.sq{border-radius:14px}
.av-ring{box-shadow:0 0 0 3px rgba(255,255,255,.09),0 0 0 6px rgba(124,92,255,.25)}

/* ---------- progress / bars ---------- */
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--v),var(--c));transition:width .4s}
.bar.g > i{background:linear-gradient(90deg,#12A87B,var(--green))}
.bar.a > i{background:linear-gradient(90deg,#E29308,var(--amber))}

/* ---------- stat ---------- */
.stat{padding:15px 16px;border-radius:var(--r2);background:var(--panel);border:1px solid var(--stroke)}
.stat .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);font-weight:700}
.stat .v{font-family:var(--fd);font-size:27px;font-weight:800;margin-top:5px;letter-spacing:-.03em}

/* ---------- inputs ---------- */
.input,textarea.input,select.input{
  width:100%;padding:13px 15px;border-radius:13px;background:rgba(255,255,255,.05);
  border:1px solid var(--stroke);color:var(--txt);font-size:15px;font-family:inherit;outline:none;transition:.16s
}
.input::placeholder{color:var(--dim)}
.input:focus{border-color:rgba(124,92,255,.75);background:rgba(124,92,255,.08);box-shadow:0 0 0 4px rgba(124,92,255,.14)}
textarea.input{resize:none;min-height:104px;line-height:1.5}
.label{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.03em;margin-bottom:7px;display:block}

/* ---------- choice / options ---------- */
.opt{
  display:flex;align-items:center;gap:14px;padding:15px 16px;border-radius:var(--r2);
  background:var(--panel);border:1.5px solid var(--stroke);cursor:pointer;transition:.16s;
  font-weight:600;font-size:15px;text-align:left;width:100%;color:var(--txt)
}
.opt:hover{border-color:var(--stroke2);background:var(--panel2);transform:translateX(3px)}
.opt .k{
  width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto;
  background:rgba(255,255,255,.09);font-weight:800;font-size:13px;color:var(--muted)
}
.opt.sel{border-color:var(--v);background:rgba(124,92,255,.15)}
.opt.sel .k{background:var(--v);color:#fff}
.opt.ok{border-color:var(--green);background:rgba(52,211,153,.15)}
.opt.ok .k{background:var(--green);color:#04241A}
.opt.ko{border-color:var(--red);background:rgba(255,92,122,.13)}
.opt.ko .k{background:var(--red);color:#2A0410}
.opt.dead{opacity:.45;cursor:default;transform:none}
.opt.dead:hover{transform:none}

/* ---------- ring countdown ---------- */
.ring{position:relative;display:grid;place-items:center}
.ring svg{transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .num{font-family:var(--fd);font-weight:800;letter-spacing:-.04em;line-height:1}

/* ---------- ranking ---------- */
.rank{display:flex;align-items:center;gap:13px;padding:11px 13px;border-radius:var(--r2);background:var(--panel);border:1px solid var(--stroke)}
.rank.me{border-color:rgba(124,92,255,.6);background:rgba(124,92,255,.14)}
.rank .pos{font-family:var(--fd);font-weight:800;width:26px;text-align:center;color:var(--muted);font-size:14px}
.rank.top1 .pos{color:var(--amber)}
.rank.top2 .pos{color:#D6E2FF}
.rank.top3 .pos{color:#F0A87A}

/* ---------- tombola ---------- */
.ticket{
  position:relative;border-radius:var(--r2);padding:16px;overflow:hidden;
  background:linear-gradient(135deg,rgba(255,111,181,.20),rgba(124,92,255,.20));
  border:1px solid rgba(255,255,255,.22)
}
.ticket::before,.ticket::after{
  content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:var(--bg);
  top:50%;transform:translateY(-50%)
}
.ticket::before{left:-12px}.ticket::after{right:-12px}
.roll{
  display:flex;align-items:center;gap:16px;padding:18px;border-radius:var(--r);
  background:linear-gradient(135deg,rgba(124,92,255,.24),rgba(34,211,238,.16));
  border:1.5px solid rgba(255,255,255,.26)
}
.roll.blur{filter:blur(1.2px)}
.shuffling{animation:shake .28s infinite}
@keyframes shake{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

/* ---------- qr ---------- */
.qrbox{background:#fff;padding:14px;border-radius:var(--r2);display:inline-block;line-height:0;box-shadow:0 16px 40px -14px rgba(0,0,0,.9)}
.qrbox svg{display:block;width:100%;height:auto}

/* ---------- chat / qa ---------- */
.q{
  padding:14px 16px;border-radius:var(--r2);background:var(--panel);border:1px solid var(--stroke);
  border-left:3px solid var(--v)
}
.q.pending{border-left-color:var(--amber)}
.q.answered{border-left-color:var(--green);opacity:.72}
.q.rejected{border-left-color:var(--red);opacity:.55}
.q.hi{border-left-color:var(--c);background:rgba(34,211,238,.09)}

/* ---------- screen (projection) ---------- */
.screen{min-height:100vh;display:flex;flex-direction:column;padding:34px 40px 26px}
.screen-head{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:26px}
.screen-title{font-family:var(--fd);font-size:clamp(26px,3.4vw,52px);font-weight:800;letter-spacing:-.03em;line-height:1.03}
.big{font-family:var(--fd);font-weight:800;letter-spacing:-.045em;line-height:.92}
.mega{font-size:clamp(64px,13vw,190px)}
.huge{font-size:clamp(38px,6.4vw,86px)}
.qscreen{font-size:clamp(24px,3.1vw,46px);font-weight:800;font-family:var(--fd);letter-spacing:-.025em;line-height:1.14}
.optbig{
  display:flex;align-items:center;gap:16px;padding:18px 22px;border-radius:18px;
  background:rgba(255,255,255,.06);border:1.5px solid var(--stroke);font-size:clamp(15px,1.5vw,23px);font-weight:650
}
.optbig .k{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.1);display:grid;place-items:center;font-weight:800;font-family:var(--fd)}
.optbig.ok{border-color:var(--green);background:rgba(52,211,153,.17)}
.optbig.ok .k{background:var(--green);color:#04241A}
.optbig.ko{opacity:.42}
.screen-cta{
  display:flex;align-items:center;gap:14px;padding:22px 26px;border-radius:20px;
  background:linear-gradient(135deg,rgba(124,92,255,.26),rgba(34,211,238,.18));border:1.5px solid rgba(255,255,255,.24)
}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;width:10px;height:16px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(760deg);opacity:.1}}

/* ---------- misc ---------- */
.scroll{padding-right:6px;overflow:visible}
.access-menu{position:relative}
.access-trigger{display:flex;align-items:center;gap:8px;padding:8px 11px;border-radius:12px;border:1px solid var(--stroke);background:var(--panel);color:var(--txt);font:700 12px var(--f);cursor:pointer}
.access-trigger:hover{background:var(--panel2)}
.access-trigger .chevron{color:var(--muted);font-size:14px;line-height:1}
.access-popover{position:absolute;right:0;top:calc(100% + 9px);z-index:80;display:grid;gap:5px;min-width:205px;padding:8px;border-radius:15px;border:1px solid var(--stroke2);background:rgba(13,18,38,.96);box-shadow:var(--shadow);backdrop-filter:blur(22px)}
.access-popover button{display:flex;align-items:center;gap:9px;padding:10px 11px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--muted);text-align:left;font:700 12px var(--f);cursor:pointer}
.access-popover button:hover{color:var(--txt);background:var(--panel2);border-color:var(--stroke)}
.access-popover .access-danger{color:#ffb0c0}
.slide-layout{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:16px}
.slide-preview{min-height:390px;padding:26px;border-radius:var(--r);border:1px solid var(--stroke);background:radial-gradient(circle at 82% 20%,rgba(34,211,238,.19),transparent 22rem),linear-gradient(135deg,rgba(124,92,255,.24),rgba(255,255,255,.04));display:flex;align-items:center;justify-content:center;text-align:left}
.slide-copy{max-width:700px;width:100%}
.slide-copy .slide-kicker{color:#9beaf7;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.slide-copy h2{font-size:clamp(32px,4.8vw,68px);margin:14px 0;line-height:1.02}
.slide-copy p{max-width:650px;color:#b4c2df;font-size:clamp(15px,1.5vw,21px);line-height:1.45}
.slide-thumbs{display:grid;gap:8px;align-content:start}
.slide-thumb{display:grid;grid-template-columns:30px 1fr;gap:9px;align-items:center;padding:10px;border-radius:12px;border:1px solid var(--stroke);background:var(--panel);color:var(--muted);text-align:left;cursor:pointer}
.slide-thumb:hover,.slide-thumb.on{color:var(--txt);border-color:rgba(124,92,255,.7);background:rgba(124,92,255,.15)}
.slide-thumb b{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.08);font-family:var(--fd)}
.slide-thumb span{font-size:12px;font-weight:700;line-height:1.2}
.scene-slide{min-height:60vh;width:min(1180px,100%);padding:clamp(32px,7vw,110px);border-radius:32px;border:1px solid rgba(255,255,255,.15);background:radial-gradient(circle at 76% 18%,rgba(34,211,238,.22),transparent 28rem),linear-gradient(135deg,rgba(124,92,255,.28),rgba(255,255,255,.045));display:flex;align-items:center}
.scene-slide h2{font-size:clamp(46px,7vw,112px)}
.scene-slide p{font-size:clamp(18px,2vw,30px);max-width:840px}
@media (max-width:760px){.slide-layout{grid-template-columns:1fr}.slide-thumbs{grid-template-columns:repeat(2,minmax(0,1fr))}.slide-preview{min-height:320px}.access-popover{right:-10px}}
.divider{height:1px;background:var(--stroke);margin:16px 0}
.kbd{
  font-family:ui-monospace,monospace;font-size:11.5px;padding:2px 7px;border-radius:7px;
  background:rgba(255,255,255,.08);border:1px solid var(--stroke)
}
.tagline{font-size:13px;color:var(--dim);margin-top:4px}
.hero{text-align:center;padding:52px 20px 30px}
.hero h1{font-size:clamp(34px,5.4vw,62px);font-weight:800;letter-spacing:-.045em}
.grad{background:linear-gradient(115deg,#C9B8FF,var(--c) 45%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.rolecard{
  display:flex;flex-direction:column;gap:9px;padding:22px;border-radius:var(--r);
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));
  border:1px solid var(--stroke);transition:.2s;cursor:pointer;text-align:left
}
.rolecard:hover{transform:translateY(-4px);border-color:var(--stroke2);box-shadow:0 26px 60px -22px rgba(124,92,255,.9)}
.rolecard .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:rgba(124,92,255,.2);border:1px solid rgba(124,92,255,.4)}
.tabs{display:flex;gap:6px;padding:6px;background:var(--panel);border:1px solid var(--stroke);border-radius:15px;flex-wrap:wrap}
.tabs button{
  padding:10px 16px;border-radius:11px;border:1px solid transparent;background:transparent;
  color:var(--muted);font-weight:700;font-size:13.5px;cursor:pointer;transition:.16s
}
.tabs button:hover{color:var(--txt);background:var(--panel2)}
.tabs button.on{background:var(--panel2);color:var(--txt);border-color:var(--stroke2)}
.note{
  padding:12px 14px;border-radius:12px;background:rgba(34,211,238,.08);border:1px dashed rgba(34,211,238,.4);
  font-size:12.5px;color:#9BEAF7;line-height:1.5
}
.banner{
  padding:14px 18px;border-radius:var(--r2);display:flex;align-items:center;gap:12px;
  background:linear-gradient(135deg,rgba(255,176,32,.16),rgba(255,111,181,.12));border:1px solid rgba(255,176,32,.35)
}

@media (max-width:900px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:1fr}
  .screen{padding:22px 18px}
}
@media (max-width:620px){
  .g2{grid-template-columns:1fr}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .wrap{padding:16px 14px 80px}
  .topbar-in{padding:10px 14px;gap:10px}
  .brand span{display:none}
}

</style>
</head>
<body>
<div id="app"></div>
<script>
/* shim : ?view=<route> -> #/<route>, puis ?as=<id> -> identité locale */
(function () {
  try {
    var q = new URLSearchParams(location.search);
    var v = q.get('view');
    if (v) location.hash = '#/' + v.replace(/^#?\/?/, '');
    var as = q.get('as');
    if (as) {
      var me = as.indexOf('iv-') === 0
        ? { role: 'intervenant', intervenantId: as }
        : { role: 'participant', participantId: as };
      localStorage.setItem('btl-live-me-v1', JSON.stringify(me));
    }
  } catch (e) {}
})();

<script>
/* ============================================================
   BTL Live — Store réactif + synchronisation temps réel simulée
   ------------------------------------------------------------
   Ici : BroadcastChannel + localStorage (multi-onglets).
   En production : remplacer store.set/update par des appels
   Supabase (RPC) + un canal Realtime qui pousse l'état.
   Les vues n'ont pas besoin de changer : elles ne parlent qu'au store.
   ============================================================ */
window.BTL = window.BTL || {};

(function () {
  const KEY = 'btl-live-state-v1';
  const ME_KEY = 'btl-live-me-v1';
  const CHANNEL = 'btl-live';

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (!parsed || parsed.version !== 1) return null;
      return parsed;
    } catch (e) { return null; }
  }

  let state = load() || BTL.seed();
  const subs = new Set();
  let channel = null;

  try {
    channel = new BroadcastChannel(CHANNEL);
    channel.onmessage = function (e) {
      if (e.data && e.data.type === 'state') {
        state = e.data.state;
        emit();
      }
    };
  } catch (e) { channel = null; }

  window.addEventListener('storage', function (e) {
    if (e.key === KEY && e.newValue) {
      try { state = JSON.parse(e.newValue); emit(); } catch (err) {}
    }
  });

  function emit() { subs.forEach(function (f) { try { f(state); } catch (e) { console.error(e); } }); }

  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  function push() {
    if (channel) { try { channel.postMessage({ type: 'state', state: state }); } catch (e) {} }
  }

  function log(who, what) {
    state.logs = state.logs || [];
    state.logs.unshift({ id: 'l-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6), at: Date.now(), who: who, what: what });
    state.logs = state.logs.slice(0, 40);
  }

  const store = {
    get: function () { return state; },

    /** Remplacement complet de l'état (utilisé par la synchro) */
    set: function (updater) {
      state = (typeof updater === 'function') ? updater(state) : updater;
      persist(); emit(); push();
    },

    /** Mutation : fn reçoit un brouillon cloné, on publie le résultat */
    update: function (fn) {
      const draft = clone(state);
      fn(draft);
      state = draft;
      persist(); emit(); push();
    },

    /** Mutation + journalisation d'une action organisateur */
    act: function (who, what, fn) {
      const draft = clone(state);
      if (fn) fn(draft);
      log(who, what);
      state = draft;
      persist(); emit(); push();
    },

    subscribe: function (fn) { subs.add(fn); return function () { subs.delete(fn); }; },

    reset: function () {
      state = BTL.seed();
      persist(); emit(); push();
    },

    /* ---------- identité locale (mock d'auth) ---------- */
    me: function () {
      try { return JSON.parse(localStorage.getItem(ME_KEY) || 'null'); } catch (e) { return null; }
    },
    setMe: function (v) {
      try {
        if (v) localStorage.setItem(ME_KEY, JSON.stringify(v));
        else localStorage.removeItem(ME_KEY);
      } catch (e) {}
    },

    /* ---------- horloge globale : pilote les transitions de phase ---------- */
    boot: function () {
      setInterval(function () {
        const q = state.quiz;
        if (q && q.status === 'question') {
          const dur = (q.questions[q.currentIndex] || {}).duration || 20;
          if (Date.now() - q.startedAt > dur * 1000 + 400) {
            store.update(function (d) { d.quiz.status = 'reveal'; });
          }
        }
      }, 400);
      setInterval(function () {
        const now = Date.now();
        const expiredParticipants = state.participants.filter(function (p) { return p.expiresAt && p.expiresAt <= now; }).length;
        const expiredSpeakers = state.event.intervenantExpiresAt && new Date(state.event.intervenantExpiresAt).getTime() <= now;
        if (expiredParticipants || (expiredSpeakers && state.intervenants.length)) {
          store.act('Système', 'Nettoyage des accès Event expirés', function (d) {
            d.participants = d.participants.filter(function (p) { return !p.expiresAt || p.expiresAt > now; });
            if (expiredSpeakers) d.intervenants = [];
          });
        }
      }, 60000);
    }
  };

  /* ---------- sélecteurs ---------- */
  store.leaderboard = function (s) {
    s = s || state;
    const totals = {};
    s.quiz.answers.forEach(function (a) {
      totals[a.participantId] = (totals[a.participantId] || 0) + a.points;
    });
    return s.participants
      .map(function (p) { return { id: p.id, pseudo: p.pseudo, photo: p.photo, score: totals[p.id] || 0, number: p.number }; })
      .sort(function (a, b) { return b.score - a.score || a.pseudo.localeCompare(b.pseudo); });
  };

  store.answerOf = function (s, questionId, participantId) {
    return s.quiz.answers.find(function (a) { return a.questionId === questionId && a.participantId === participantId; });
  };

  store.answersFor = function (s, questionId) {
    return s.quiz.answers.filter(function (a) { return a.questionId === questionId; });
  };

  store.participant = function (s, id) {
    return s.participants.find(function (p) { return p.id === id; }) || null;
  };

  store.tombolaPool = function (s) {
    return s.participants.filter(function (p) { return p.tombola; });
  };

  store.qaFor = function (s, intervenantId) {
    return s.qa.questions
      .filter(function (q) { return q.intervenantId === intervenantId; })
      .sort(function (a, b) { return (b.votes - a.votes) || (b.createdAt - a.createdAt); });
  };

  store.pendingCount = function (s) {
    return s.qa.questions.filter(function (q) { return q.status === 'pending'; }).length;
  };

  store.timeAgo = function (ts) {
    const s = Math.floor((Date.now() - ts) / 1000);
    if (s < 60) return 'il y a ' + s + ' s';
    const m = Math.floor(s / 60);
    if (m < 60) return 'il y a ' + m + ' min';
    return 'il y a ' + Math.floor(m / 60) + ' h';
  };

  BTL.store = store;
})();

</script>
<script>
/* ============================================================
   BTL Live — Briques d'interface partagées
   ============================================================ */
window.BTL = window.BTL || {};
(function () {
  const h = preact.h;
  const html = htm.bind(h);
  BTL.h = h;
  BTL.html = html;
  BTL.hooks = preactHooks;
  const { useState, useEffect, useRef, useMemo } = preactHooks;

  function initialsOf(p) {
    if (!p) return '?';
    if (p.initials) return p.initials;
    const parts = String(p.pseudo || p.name || '?').split(/\s+/).filter(Boolean);
    return parts.map(function (w) { return w[0]; }).join('').slice(0, 2).toUpperCase();
  }

  function Avatar(props) {
    const p = props.p;
    const [err, setErr] = useState(false);
    const size = props.size || 40;
    const style = { width: size + 'px', height: size + 'px', fontSize: Math.round(size * 0.38) + 'px' };
    if (props.square) style.borderRadius = Math.round(size * 0.3) + 'px';
    if (p && p.color) style.background = 'linear-gradient(135deg,' + p.color + ',#22D3EE)';
    const cls = 'av' + (props.square ? ' sq' : '') + (props.ring ? ' av-ring' : '');
    if (p && p.photo && !err) {
      return html`<div class=${cls} style=${style}><img src=${p.photo} alt=${p.pseudo || p.name || ''} loading="lazy" onError=${function () { setErr(true); }} /></div>`;
    }
    return html`<div class=${cls} style=${style}>${initialsOf(p)}</div>`;
  }

  function Pill(props) {
    return html`<span class=${'pill' + (props.tone ? ' ' + props.tone : '')}>${props.children}</span>`;
  }

  function Bar(props) {
    const pct = Math.max(0, Math.min(100, props.pct || 0));
    return html`<div class=${'bar' + (props.tone ? ' ' + props.tone : '')}><i style=${{ width: pct + '%' }}></i></div>`;
  }

  function Stat(props) {
    return html`<div class="stat"><div class="k">${props.k}</div><div class="v" style=${props.color ? { color: props.color } : null}>${props.v}</div></div>`;
  }

  /* ---------- anneau de compte à rebours ---------- */
  function Ring(props) {
    const size = props.size || 120;
    const stroke = props.stroke || Math.max(7, Math.round(size * 0.07));
    const [now, setNow] = useState(Date.now());
    useEffect(function () {
      const t = setInterval(function () { setNow(Date.now()); }, 100);
      return function () { clearInterval(t); };
    }, []);
    const total = (props.total || 20) * 1000;
    const left = Math.max(0, total - (now - props.startedAt));
    const pct = total > 0 ? left / total : 0;
    const r = (size - stroke) / 2;
    const c = 2 * Math.PI * r;
    const secs = Math.ceil(left / 1000);
    const color = pct > 0.5 ? 'var(--c)' : pct > 0.22 ? 'var(--amber)' : 'var(--red)';
    return html`<div class="ring" style=${{ width: size + 'px', height: size + 'px' }}>
      <svg width=${size} height=${size}>
        <circle cx=${size / 2} cy=${size / 2} r=${r} fill="none" stroke="rgba(255,255,255,.10)" stroke-width=${stroke} />
        <circle cx=${size / 2} cy=${size / 2} r=${r} fill="none" stroke=${color} stroke-width=${stroke}
          stroke-linecap="round" stroke-dasharray=${c} stroke-dashoffset=${c * (1 - pct)}
          style="transition:stroke-dashoffset .12s linear" />
      </svg>
      <div class="lbl"><div class="num" style=${{ fontSize: Math.round(size * 0.33) + 'px', color: color }}>${secs}</div></div>
    </div>`;
  }

  /* ---------- QR code (généré côté client) ---------- */
  function QR(props) {
    const ref = useRef(null);
    useEffect(function () {
      const el = ref.current;
      if (!el) return;
      try {
        const qr = qrcode(0, 'M');
        qr.addData(props.text);
        qr.make();
        el.innerHTML = qr.createSvgTag({ cellSize: 8, margin: 0 });
      } catch (e) {
        el.textContent = 'QR indisponible';
      }
    }, [props.text]);
    return html`<div class="qrbox" ref=${ref} style=${{ width: (props.size || 240) + 'px' }}></div>`;
  }

  /* ---------- confettis ---------- */
  function Confetti(props) {
    const items = useMemo(function () {
      const colors = ['#7C5CFF', '#22D3EE', '#FFB020', '#FF6FB5', '#34D399', '#FFFFFF'];
      const arr = [];
      for (let i = 0; i < 96; i++) {
        arr.push({
          left: Math.random() * 100,
          delay: Math.random() * 0.9,
          dur: 2.6 + Math.random() * 2.6,
          color: colors[i % colors.length],
          rot: Math.round(Math.random() * 360)
        });
      }
      return arr;
    }, [props.run]);
    if (!props.run) return null;
    return html`<div class="confetti">
      ${items.map(function (it, i) {
        return html`<i key=${i} style=${{ left: it.left + '%', top: '-26px', background: it.color, animationDelay: it.delay + 's', animationDuration: it.dur + 's', transform: 'rotate(' + it.rot + 'deg)' }}></i>`;
      })}
    </div>`;
  }

  function RankRow(props) {
    const r = props.r, i = props.i;
    const medal = i === 0 ? 'top1' : i === 1 ? 'top2' : i === 2 ? 'top3' : '';
    return html`<div class=${'rank ' + medal + (props.me ? ' me' : '')} style="margin-bottom:8px">
      <div class="pos">${i + 1}</div>
      <${Avatar} p=${r} size=${38} />
      <div style="flex:1;min-width:0">
        <div style="font-weight:700;font-size:14.5px">${r.pseudo}${props.me ? ' · vous' : ''}</div>
        <div class="tiny dim mono">n° ${r.number}</div>
      </div>
      <div class="mono" style="font-weight:800;font-size:16px">${r.score}<span class="tiny dim" style="margin-left:3px">pts</span></div>
    </div>`;
  }

  BTL.ui = { Avatar, Pill, Bar, Stat, Ring, QR, Confetti, RankRow, initialsOf };
})();

</script>
<script>
/* ============================================================
   BTL Live — Module QUIZ
   participant / écran / organisateur
   ============================================================ */
window.BTL = window.BTL || {};
(function () {
  const html = BTL.html;
  const { useState, useEffect } = BTL.hooks;
  const S = BTL.store;
  const U = BTL.ui;

  /* Simule l'arrivée progressive des réponses des autres participants.
     À remplacer en production par un abonnement Supabase Realtime sur quiz_answers. */
  function spawnBots(qIndex) {
    const s0 = S.get();
    const q = s0.quiz.questions[qIndex];
    if (!q) return;
    s0.participants.forEach(function (p) {
      if (S.answerOf(s0, q.id, p.id)) return;
      const delay = 800 + Math.random() * Math.max(600, q.duration * 1000 - 2000);
      setTimeout(function () {
        const st = S.get();
        if (st.quiz.status !== 'question' || st.quiz.currentIndex !== qIndex) return;
        if (S.answerOf(st, q.id, p.id)) return;
        const correct = Math.random() < 0.6;
        let opt = q.correct;
        if (!correct) { do { opt = Math.floor(Math.random() * q.options.length); } while (opt === q.correct); }
        const ms = Date.now() - st.quiz.startedAt;
        const speed = Math.max(0, 1 - ms / (q.duration * 1000));
        S.update(function (d) {
          d.quiz.answers.push({
            id: 'a-' + q.id + '-' + p.id, questionId: q.id, participantId: p.id,
            option: opt, correct: correct, ms: ms,
            points: correct ? Math.round(q.points + 50 * speed) : 0, at: Date.now()
          });
        });
      }, delay);
    });
  }

  /* ------------------------ PARTICIPANT ------------------------ */
  function QuizParticipant(props) {
    const s = props.s, me = props.me;
    const pid = me.participantId;
    const Q = s.quiz;
    const q = Q.questions[Q.currentIndex];
    const [pick, setPick] = useState(null);
    const phase = Q.status + ':' + Q.currentIndex;
    useEffect(function () { setPick(null); }, [phase]);

    const ans = q ? S.answerOf(s, q.id, pid) : null;
    const lb = S.leaderboard(s);
    const idx = lb.findIndex(function (x) { return x.id === pid; });
    const mine = idx >= 0 ? lb[idx] : { score: 0 };

    if (Q.status === 'ended') {
      return html`<div class="wrap narrow col">
        <div class="card glow center">
          <${U.Pill} tone="v">Quiz terminé</${U.Pill}>
          <div class="big huge grad mt">${mine.score}<span style="font-size:.4em"> pts</span></div>
          <div class="muted mt-s">Classement : ${idx + 1}<sup>e</sup> sur ${lb.length}</div>
        </div>
        <div class="card">
          <div class="card-h"><div class="card-t">Classement final</div></div>
          ${lb.slice(0, 10).map(function (r, i) { return html`<${U.RankRow} key=${r.id} r=${r} i=${i} me=${r.id === pid} />`; })}
        </div>
      </div>`;
    }

    if (!q || Q.status === 'idle') {
      return html`<div class="wrap narrow">
        <div class="card center">
          <${U.Pill} tone="a">En attente</${U.Pill}>
          <h2 class="mt">Le quiz n'a pas encore démarré</h2>
          <p class="muted mt-s">Restez sur cette page : la première question apparaîtra automatiquement.</p>
        </div>
      </div>`;
    }

    const revealed = Q.status === 'reveal';
    const mineAns = ans;

    return html`<div class="wrap narrow col">
      <div class="row between">
        <div class="row">
          <${U.Pill} tone="v">Question ${Q.currentIndex + 1} / ${Q.questions.length}</${U.Pill}>
        </div>
        <div class="row">
          <${U.Avatar} p=${S.participant(s, pid)} size=${32} />
          <div class="mono small" style="font-weight:800">${mine.score} pts</div>
        </div>
      </div>
      <${U.Bar} pct=${((Q.currentIndex) / Q.questions.length) * 100} />

      ${!revealed && !mineAns ? html`<div class="card glow">
        <div class="row between" style="align-items:flex-start">
          <div class="pill a">${q.points} pts max</div>
          <${U.Ring} total=${q.duration} startedAt=${Q.startedAt} size=${104} />
        </div>
        <h2 class="mt" style="font-size:21px;line-height:1.25">${q.prompt}</h2>
        <div class="col mt">
          ${q.options.map(function (o, i) {
            return html`<button key=${i} class=${'opt' + (pick === i ? ' sel' : '')} onClick=${function () { setPick(i); }} disabled=${pick !== null}>
              <span class="k">${'ABCD'[i]}</span><span>${o}</span>
            </button>`;
          })}
        </div>
        <button class="btn primary block mt" disabled=${pick === null}
          onClick=${function () { submit(pick); }}>Valider ma réponse</button>
        <p class="tiny dim center mt-s">Rappel : plus vous répondez vite, plus vous marquez de points.</p>
      </div>` : null}

      ${!revealed && mineAns ? html`<div class="card center glow">
        <div class="big huge" style="color:var(--c)">✓</div>
        <h2 class="mt">Réponse enregistrée</h2>
        <p class="muted mt-s">En attente des autres participants…</p>
        <div class="mt"><${U.Ring} total=${q.duration} startedAt=${Q.startedAt} size=${88} /></div>
        <p class="tiny dim mt-s">${S.answersFor(s, q.id).length} / ${s.participants.length} réponses reçues</p>
      </div>` : null}

      ${revealed ? html`<div class="card glow">
        <div class="row between">
          <${U.Pill} tone="c">Résultats</${U.Pill}>
          ${mineAns ? html`<div class="mono" style="font-weight:800;color:${mineAns.correct ? 'var(--green)' : 'var(--red)'}">
            +${mineAns.points} pts</div>` : null}
        </div>
        <h2 class="mt" style="font-size:19px;line-height:1.28">${q.prompt}</h2>
        <div class="col mt">
          ${q.options.map(function (o, i) {
            let cls = 'opt dead';
            if (i === q.correct) cls = 'opt ok';
            else if (mineAns && mineAns.option === i) cls = 'opt ko';
            return html`<div key=${i} class=${cls}>
              <span class="k">${'ABCD'[i]}</span><span style="flex:1">${o}</span>
              ${i === q.correct ? html`<span class="tiny" style="font-weight:800">BONNE RÉPONSE</span>` : null}
            </div>`;
          })}
        </div>
        <div class="divider"></div>
        <div class="muted small">Votre classement : <b style="color:var(--txt)">${idx + 1}<sup>e</sup></b> · ${mine.score} pts</div>
      </div>` : null}
    </div>`;

    function submit(i) {
      if (i === null || mineAns || Q.status !== 'question') return;
      const ms = Date.now() - Q.startedAt;
      const speed = Math.max(0, 1 - ms / (q.duration * 1000));
      const ok = i === q.correct;
      S.update(function (d) {
        if (d.quiz.answers.some(function (a) { return a.questionId === q.id && a.participantId === pid; })) return;
        d.quiz.answers.push({
          id: 'a-' + q.id + '-' + pid, questionId: q.id, participantId: pid,
          option: i, correct: ok, ms: ms,
          points: ok ? Math.round(q.points + 50 * speed) : 0, at: Date.now()
        });
      });
    }
  }

  /* ------------------------ ÉCRAN ------------------------ */
  function QuizScreen(props) {
    const s = props.s;
    const Q = s.quiz;
    const q = Q.questions[Q.currentIndex];
    const total = s.participants.length;

    if (Q.status === 'idle' || !q) {
      return html`<div class="screen">
        <div class="screen-head">
          <div class="row"><div class="logo">BTL</div><div>
            <div class="screen-title">${s.event.name}</div>
            <div class="muted">${s.event.client} · ${s.event.venue}</div>
          </div></div>
          <${U.Pill} tone="a">Quiz en attente</${U.Pill}>
        </div>
        <div style="flex:1;display:grid;place-items:center">
          <div class="center">
            <div class="mega big grad">QUIZ</div>
            <div class="screen-title muted mt">En attente du lancement…</div>
          </div>
        </div>
      </div>`;
    }

    const answers = S.answersFor(s, q.id);
    const dist = q.options.map(function (_, i) { return answers.filter(function (a) { return a.option === i; }).length; });
    const revealed = Q.status === 'reveal';
    const lb = S.leaderboard(s).slice(0, 6);

    return html`<div class="screen">
      <div class="screen-head">
        <div class="row"><div class="logo">BTL</div><div>
          <div class="screen-title">${s.event.name}</div>
          <div class="muted">${s.event.client} · Question ${Q.currentIndex + 1} sur ${Q.questions.length}</div>
        </div></div>
        <div class="row" style="gap:22px">
          <div class="center">
            <div class="tiny dim" style="font-weight:700;letter-spacing:.1em">RÉPONSES</div>
            <div class="big" style="font-size:34px">${answers.length}<span class="dim" style="font-size:.5em"> / ${total}</span></div>
          </div>
          ${revealed ? html`<${U.Pill} tone="c">RÉPONSES</${U.Pill}>` : html`<${U.Ring} total=${q.duration} startedAt=${Q.startedAt} size=${112} stroke=${10} />`}
          <${U.QR} text=${location.origin + location.pathname + '?view=join&module=quiz'} size=${104} />
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 300px;gap:26px;flex:1">
        <div>
          <div class="qscreen">${q.prompt}</div>
          <div class="mt-l" style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
            ${q.options.map(function (o, i) {
              let cls = 'optbig';
              if (revealed && i === q.correct) cls += ' ok';
              else if (revealed) cls += ' ko';
              return html`<div key=${i} class=${cls}>
                <span class="k">${'ABCD'[i]}</span>
                <span style="flex:1">${o}</span>
                ${revealed ? html`<span class="mono" style="font-weight:800">${Math.round(dist[i] / Math.max(1, answers.length) * 100)} %</span>` : null}
              </div>`;
            })}
          </div>
        </div>

        <div class="card flat" style="align-self:start">
          <div class="card-h"><div class="card-t">Classement live</div></div>
          ${lb.map(function (r, i) { return html`<${U.RankRow} key=${r.id} r=${r} i=${i} />`; })}
          <div class="tiny dim center mt-s">Scores mis à jour en direct</div>
        </div>
      </div>

      ${revealed ? html`<div class="screen-cta mt-l">
        <div class="big" style="font-size:40px;color:var(--green)">✓</div>
        <div>
          <div style="font-weight:800;font-size:22px">Bonne réponse : ${'ABCD'[q.correct]} — ${q.options[q.correct]}</div>
          <div class="muted">${answers.filter(function (a) { return a.correct; }).length} participants ont trouvé la bonne réponse.</div>
        </div>
      </div>` : null}
    </div>`;
  }

  /* ------------------------ ORGANISATEUR ------------------------ */
  function QuizAdmin(props) {
    const s = props.s;
    const Q = s.quiz;
    const q = Q.questions[Q.currentIndex];
    const answers = q ? S.answersFor(s, q.id) : [];
    const lb = S.leaderboard(s);

    function launch(i) {
      S.act('Organisateur', 'Question ' + (i + 1) + ' lancée', function (d) {
        d.quiz.status = 'question'; d.quiz.currentIndex = i; d.quiz.startedAt = Date.now();
      });
      spawnBots(i);
    }

    return html`<div class="wrap col">
      <div class="row between wrap-row">
        <div>
          <h1 style="font-size:26px">Pilotage du quiz</h1>
          <p class="muted small">Lancez les questions, révélez les réponses, suivez le classement.</p>
        </div>
        <div class="row">
          <${U.Pill} tone=${Q.status === 'question' ? 'c' : Q.status === 'reveal' ? 'g' : 'k'}>
            ${Q.status === 'question' ? 'Question en cours' : Q.status === 'reveal' ? 'Réponses révélées' : Q.status === 'ended' ? 'Quiz terminé' : "À l'arrêt"}
          </${U.Pill}>
        </div>
      </div>

      <div class="grid g4 mt">
        <${U.Stat} k="Participants" v=${s.participants.length} />
        <${U.Stat} k="Réponses reçues" v=${answers.length} color="var(--c)" />
        <${U.Stat} k="Taux de réponse" v=${Math.round(answers.length / Math.max(1, s.participants.length) * 100) + ' %'} color="var(--green)" />
        <${U.Stat} k="Bonnes réponses" v=${answers.filter(function (a) { return a.correct; }).length} color="var(--amber)" />
      </div>

      <div class="grid g2 mt">
        <div class="card">
          <div class="card-h"><div class="card-t">Questions</div><div class="spacer"></div>
            <button class="btn xs" onClick=${function () { S.act('Organisateur', 'Quiz réinitialisé', function (d) { d.quiz.status = 'idle'; d.quiz.currentIndex = 0; d.quiz.answers = []; }); }}>Réinitialiser</button>
          </div>
          ${Q.questions.map(function (qq, i) {
            const on = i === Q.currentIndex;
            const n = S.answersFor(s, qq.id).length;
            return html`<div key=${qq.id} class="row between" style=${{ padding: '10px 0', borderBottom: '1px solid var(--stroke)' }}>
              <div style="min-width:0;flex:1">
                <div class="small" style="font-weight:650">${i + 1}. ${qq.prompt}</div>
                <div class="tiny dim mono">${qq.duration} s · ${n} réponse(s)</div>
              </div>
              <button class=${'btn xs ' + (on && Q.status === 'question' ? 'cyan' : '')} onClick=${function () { launch(i); }}>
                ${on && Q.status === 'question' ? 'En cours' : 'Lancer'}
              </button>
            </div>`;
          })}
        </div>

        <div class="col">
          <div class="card">
            <div class="card-h"><div class="card-t">Répartition — question ${Q.currentIndex + 1}</div></div>
            ${!q ? html`<p class="muted small">Aucune question active.</p>` : q.options.map(function (o, i) {
              const n = answers.filter(function (a) { return a.option === i; }).length;
              const pct = Math.round(n / Math.max(1, answers.length) * 100);
              const good = i === q.correct;
              return html`<div key=${i} class="mt-s">
                <div class="row between tiny" style="margin-bottom:5px">
                  <span style="font-weight:700;color:${good && Q.status === 'reveal' ? 'var(--green)' : 'inherit'}">${'ABCD'[i]} · ${o}</span>
                  <span class="mono dim">${n} · ${pct} %</span>
                </div>
                <${U.Bar} pct=${pct} tone=${good && Q.status === 'reveal' ? 'g' : ''} />
              </div>`;
            })}
            <div class="row mt">
              <button class="btn green" onClick=${function () { S.act('Organisateur', 'Réponses révélées', function (d) { d.quiz.status = 'reveal'; }); }}>Révéler</button>
              <button class="btn" onClick=${function () {
                const n = Math.min(Q.questions.length - 1, Q.currentIndex + 1);
                S.act('Organisateur', 'Question ' + (n + 1) + ' lancée', function (d) { d.quiz.status = 'question'; d.quiz.currentIndex = n; d.quiz.startedAt = Date.now(); });
                spawnBots(n);
              }}>Suivante</button>
              <button class="btn danger" onClick=${function () { S.act('Organisateur', 'Quiz terminé', function (d) { d.quiz.status = 'ended'; }); }}>Terminer</button>
            </div>
          </div>

          <div class="card">
            <div class="card-h"><div class="card-t">Classement général</div></div>
            <div class="scroll">
              ${lb.map(function (r, i) { return html`<${U.RankRow} key=${r.id} r=${r} i=${i} />`; })}
            </div>
          </div>
        </div>
      </div>
    </div>`;
  }

  BTL.modQuiz = { QuizParticipant, QuizScreen, QuizAdmin, spawnBots };
})();

</script>
<script>
/* ============================================================
   BTL Live — Module TOMBOLA
   inscription / tirage animé (shuffle) / gagnant
   ============================================================ */
window.BTL = window.BTL || {};
(function () {
  const html = BTL.html;
  const { useState, useEffect } = BTL.hooks;
  const S = BTL.store;
  const U = BTL.ui;

  function newNumber(state) {
    const used = state.participants.map(function (p) { return p.number; });
    let n;
    do { n = 1000 + Math.floor(Math.random() * 900); } while (used.indexOf(n) >= 0);
    return n;
  }

  function draw() {
    S.act('Organisateur', 'Tirage au sort lancé', function (d) {
      d.tombola.status = 'shuffling'; d.tombola.winnerId = null;
    });
    setTimeout(function () {
      S.act('Organisateur', 'Tirage au sort effectué', function (d) {
        const pool = d.participants.filter(function (p) { return p.tombola; });
        if (!pool.length) { d.tombola.status = 'registering'; return; }
        const w = pool[Math.floor(Math.random() * pool.length)];
        d.tombola.status = 'winner';
        d.tombola.winnerId = w.id;
        d.tombola.drawnAt = Date.now();
        d.tombola.history.unshift({
          id: 'd-' + Date.now(), winnerId: w.id, number: w.number, pseudo: w.pseudo,
          photo: w.photo, at: Date.now(), prize: d.tombola.prize || 'Lot surprise'
        });
      });
    }, 3400);
  }

  /* ------------------------ PARTICIPANT ------------------------ */
  function TombolaParticipant(props) {
    const s = props.s, me = props.me;
    const pid = me.participantId;
    const p = S.participant(s, pid);
    const t = s.tombola;
    const [pseudo, setPseudo] = useState((p && p.pseudo) || '');
    const [busy, setBusy] = useState(false);
    const winner = t.winnerId ? S.participant(s, t.winnerId) : null;

    if (!p) return html`<div class="wrap narrow"><div class="card">Participant introuvable.</div></div>`;

    if (t.status === 'winner') {
      const isMe = t.winnerId === pid;
      return html`<div class="wrap narrow col">
        <${U.Confetti} run=${true} />
        <div class="card glow center">
          <${U.Pill} tone=${isMe ? 'g' : 'a'}>${isMe ? 'Vous avez gagné !' : 'Tirage terminé'}</${U.Pill}>
          <div class="mt">${winner ? html`<${U.Avatar} p=${winner} size=${132} ring=${true} />` : null}</div>
          <h1 class="mt" style="font-size:30px">${winner ? winner.pseudo : '—'}</h1>
          <div class="mono muted">Tombola n° ${winner ? winner.number : '—'}</div>
          <div class="banner mt" style="justify-content:center">
            <span style="font-size:22px">🎁</span>
            <div><div class="tiny dim" style="font-weight:700">LOT</div><div style="font-weight:800">${t.prize || 'Lot surprise'}</div></div>
          </div>
          ${isMe ? html`<p class="muted mt">Présentez-vous sur scène pour récupérer votre lot.</p>` : null}
        </div>
        <div class="card">
          <div class="card-h"><div class="card-t">Tirages précédents</div></div>
          ${t.history.slice(1).map(function (h) {
            return html`<div key=${h.id} class="row between" style="padding:8px 0;border-bottom:1px solid var(--stroke)">
              <div class="small">${h.pseudo}</div>
              <div class="tiny dim mono">n° ${h.number} · ${h.prize}</div>
            </div>`;
          })}
          ${t.history.length <= 1 ? html`<p class="muted small">Aucun autre tirage.</p>` : null}
        </div>
      </div>`;
    }

    if (!p.tombola) {
      return html`<div class="wrap narrow col">
        <div class="card glow">
          <${U.Pill} tone="a">Inscription</${U.Pill}>
          <h2 class="mt" style="font-size:23px">Participez à la tombola</h2>
          <p class="muted small mt-s">Votre numéro de tombola est attribué automatiquement. Votre photo de badge sera utilisée lors du tirage.</p>
          <label class="label mt">Votre nom affiché</label>
          <input class="input" value=${pseudo} onInput=${function (e) { setPseudo(e.target.value); }} placeholder="ex. Nadia B." />
          <div class="row mt">
            <${U.Avatar} p=${{ pseudo: pseudo || '?', photo: p.photo }} size=${54} />
            <div class="tiny dim">Photo de badge : ${p.photo ? 'disponible' : 'absente → repli sur les initiales'}</div>
          </div>
          <button class="btn primary block mt" disabled=${!pseudo.trim() || busy} onClick=${function () {
            setBusy(true);
            S.act('Participant', (pseudo || p.pseudo) + " s'inscrit à la tombola", function (d) {
              const pp = d.participants.find(function (x) { return x.id === pid; });
              pp.pseudo = pseudo.trim();
              if (!pp.number) pp.number = newNumber(d);
              pp.tombola = true;
            });
            setTimeout(function () { setBusy(false); }, 400);
          }}>${busy ? 'Inscription…' : "S'inscrire à la tombola"}</button>
          <p class="tiny dim center mt-s">${S.tombolaPool(s).length} participants déjà inscrits</p>
        </div>
      </div>`;
    }

    return html`<div class="wrap narrow col">
      <div class="card glow">
        <div class="row between">
          <${U.Pill} tone="g">Inscription confirmée</${U.Pill}>
          <span class="tiny dim">${S.tombolaPool(s).length} en lice</span>
        </div>
        <div class="ticket mt">
          <div class="row between">
            <div>
              <div class="tiny" style="font-weight:700;letter-spacing:.1em;opacity:.8">TICKET TOMBOLA</div>
              <div class="big" style="font-size:46px">${p.number}</div>
            </div>
            <${U.Avatar} p=${p} size=${62} ring=${true} />
          </div>
          <div class="tiny mt" style="opacity:.85">${p.pseudo} · ${s.event.name}</div>
        </div>
        <div class="row mt">
          <div class="spacer"></div>
          <button class="btn xs ghost" onClick=${function () {
            S.act('Participant', p.pseudo + ' se retire de la tombola', function (d) {
              const pp = d.participants.find(function (x) { return x.id === pid; });
              pp.tombola = false;
            });
          }}>Se désinscrire</button>
        </div>
      </div>
      <div class="card center">
        <p class="muted small">Restez connecté : le tirage s'affiche ici en direct.</p>
      </div>
    </div>`;
  }

  /* ------------------------ ÉCRAN ------------------------ */
  function TombolaScreen(props) {
    const s = props.s;
    const t = s.tombola;
    const pool = S.tombolaPool(s);
    const [i, setI] = useState(0);

    useEffect(function () {
      if (t.status !== 'shuffling') return;
      const timer = setInterval(function () { setI(function (v) { return (v + 1) % Math.max(1, pool.length); }); }, 70);
      return function () { clearInterval(timer); };
    }, [t.status, pool.length]);

    const winner = t.winnerId ? S.participant(s, t.winnerId) : null;
    const shown = pool.length ? pool[i % pool.length] : null;

    return html`<div class="screen">
      <div class="screen-head">
        <div class="row"><div class="logo">BTL</div><div>
          <div class="screen-title">Tombola</div>
          <div class="muted">${s.event.name} · ${pool.length} participants en lice</div>
        </div></div>
        <div class="row"><${U.QR} text=${location.origin + location.pathname + '?view=join&module=tombola'} size=${104} /><${U.Pill} tone=${t.status === 'shuffling' ? 'a' : t.status === 'winner' ? 'g' : 'k'}>
          ${t.status === 'shuffling' ? 'Tirage en cours' : t.status === 'winner' ? 'Gagnant désigné' : 'Inscriptions ouvertes'}
        </${U.Pill}>${t.status !== 'winner' ? html`<button class="btn amber xs" disabled=${t.status === 'shuffling' || pool.length === 0} onClick=${draw}>Lancer le tirage</button>` : null}</div>
      </div>

      <div style="flex:1;display:grid;place-items:center">
        ${t.status === 'winner' && winner ? html`<div class="center">
          <${U.Confetti} run=${true} />
          <${U.Pill} tone="g">🎉 GAGNANT</${U.Pill}>
          <div class="mt-l"><${U.Avatar} p=${winner} size=${190} ring=${true} /></div>
          <div class="big mega grad mt">${winner.pseudo}</div>
          <div class="screen-title mono muted">Tombola n° ${winner.number}</div>
          <div class="screen-cta mt-l" style="justify-content:center">
            <span style="font-size:30px">🎁</span>
            <div style="text-align:left"><div class="tiny dim" style="font-weight:700;letter-spacing:.1em">LOT</div>
            <div style="font-weight:800;font-size:24px">${t.prize || 'Lot surprise'}</div></div>
          </div>
        </div>` : html`<div class="center">
          <div class="muted" style="letter-spacing:.2em;font-weight:700">TIRAGE AU SORT</div>
          <div class=${'roll mt-l ' + (t.status === 'shuffling' ? 'shuffling' : '')} style="min-width:min(760px,88vw)">
            ${shown ? html`<${U.Avatar} p=${shown} size=${112} ring=${true} />` : null}
            <div style="text-align:left">
              <div class="big" style="font-size:clamp(34px,5vw,68px)">${shown ? shown.pseudo : 'En attente'}</div>
              <div class="mono muted" style="font-size:22px">n° ${shown ? shown.number : '----'}</div>
            </div>
          </div>
          <div class="screen-title muted mt-l">${t.status === 'shuffling' ? 'Mélange des numéros…' : 'Le tirage va bientôt commencer'}</div>
        </div>`}
      </div>

      <div style="margin-top:22px">
        <div class="tiny dim" style="font-weight:700;letter-spacing:.12em;margin-bottom:10px">DERNIERS GAGNANTS</div>
        <div class="row" style="gap:14px;flex-wrap:wrap">
          ${t.history.slice(0, 6).map(function (hd) {
            return html`<div key=${hd.id} class="row" style="gap:10px;padding:9px 14px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--stroke)">
              <${U.Avatar} p=${{ pseudo: hd.pseudo, photo: hd.photo }} size=${30} />
              <div><div style="font-weight:700;font-size:13.5px">${hd.pseudo}</div><div class="tiny dim mono">n° ${hd.number}</div></div>
            </div>`;
          })}
        </div>
      </div>
    </div>`;
  }

  /* ------------------------ ORGANISATEUR ------------------------ */
  function TombolaAdmin(props) {
    const s = props.s;
    const t = s.tombola;
    const pool = S.tombolaPool(s);

    return html`<div class="wrap col">
      <div class="row between wrap-row">
        <div>
          <h1 style="font-size:26px">Pilotage de la tombola</h1>
          <p class="muted small">Gérez les inscriptions, lancez le tirage, relancez si besoin.</p>
        </div>
        <div class="row">
          <button class="btn primary" disabled=${t.status === 'shuffling' || pool.length === 0} onClick=${draw}>
            ${t.status === 'shuffling' ? 'Tirage en cours…' : 'Lancer le tirage'}
          </button>
          <button class="btn" disabled=${t.status === 'shuffling'} onClick=${draw}>Retirer un gagnant</button>
        </div>
      </div>

      <div class="grid g4 mt">
        <${U.Stat} k="Inscrits" v=${pool.length} color="var(--pink)" />
        <${U.Stat} k="Sans photo" v=${pool.filter(function (p) { return !p.photo; }).length} />
        <${U.Stat} k="Tirages effectués" v=${t.history.length} color="var(--c)" />
        <${U.Stat} k="Statut" v=${t.status === 'shuffling' ? 'Tirage' : t.status === 'winner' ? 'Gagnant' : 'Inscriptions'} color="var(--amber)" />
      </div>

      <div class="grid g2 mt">
        <div class="card">
          <div class="card-h"><div class="card-t">Participants inscrits</div><div class="spacer"></div>
            <span class="tiny dim">Décochez pour exclure du tirage</span>
          </div>
          <div class="scroll">
            ${s.participants.map(function (p) {
              return html`<div key=${p.id} class="row" style="padding:9px 0;border-bottom:1px solid var(--stroke);gap:12px">
                <${U.Avatar} p=${p} size=${38} />
                <div style="flex:1;min-width:0">
                  <div class="small" style="font-weight:650">${p.pseudo}</div>
                  <div class="tiny dim mono">n° ${p.number}</div>
                </div>
                <button class=${'btn xs ' + (p.tombola ? 'green' : '')} onClick=${function () {
                  S.act('Organisateur', (p.tombola ? 'Exclusion' : 'Inclusion') + ' de ' + p.pseudo, function (d) {
                    const pp = d.participants.find(function (x) { return x.id === p.id; });
                    pp.tombola = !pp.tombola;
                  });
                }}>${p.tombola ? 'Inscrit' : 'Exclu'}</button>
              </div>`;
            })}
          </div>
        </div>

        <div class="col">
          <div class="card">
            <div class="card-h"><div class="card-t">Lot à gagner</div></div>
            <input class="input" value=${t.prize || ''} placeholder="ex. Week-end bien-être pour 2"
              onInput=${function (e) {
                const v = e.target.value;
                S.update(function (d) { d.tombola.prize = v; });
              }} />
            <p class="tiny dim mt-s">Affiché sur l'écran géant et sur le mobile du gagnant.</p>
          </div>
          <div class="card">
            <div class="card-h"><div class="card-t">Historique des tirages</div></div>
            ${t.history.map(function (h) {
              return html`<div key=${h.id} class="row between" style="padding:9px 0;border-bottom:1px solid var(--stroke)">
                <div class="row" style="gap:10px">
                  <${U.Avatar} p=${{ pseudo: h.pseudo, photo: h.photo }} size=${32} />
                  <div><div class="small" style="font-weight:650">${h.pseudo}</div>
                  <div class="tiny dim mono">n° ${h.number}</div></div>
                </div>
                <div class="tiny dim">${S.timeAgo(h.at)}</div>
              </div>`;
            })}
            ${!t.history.length ? html`<p class="muted small">Aucun tirage pour l'instant.</p>` : null}
          </div>
        </div>
      </div>
    </div>`;
  }

  BTL.modTombola = { TombolaParticipant, TombolaScreen, TombolaAdmin, draw };
})();

</script>
<script>
/* ============================================================
   BTL Live — Module QUESTIONS / RÉPONSES
   QR code → formulaire → sélection de l'intervenant → modération
   ============================================================ */
window.BTL = window.BTL || {};
(function () {
  const html = BTL.html;
  const { useState, useEffect } = BTL.hooks;
  const S = BTL.store;
  const U = BTL.ui;

  function qaUrl() {
    return location.origin + location.pathname + '#/p/qa';
  }

  const STATUS = {
    pending: { label: 'En attente de validation', tone: 'a' },
    approved: { label: 'Retenue', tone: 'c' },
    answered: { label: 'Répondue', tone: 'g' },
    rejected: { label: 'Écartée', tone: 'r' }
  };

  /* ------------------------ PARTICIPANT ------------------------ */
  function QaParticipant(props) {
    const s = props.s, me = props.me;
    const pid = me.participantId;
    const [target, setTarget] = useState(null);
    const [body, setBody] = useState('');
    const [sent, setSent] = useState(false);
    const [tab, setTab] = useState('ask');

    const mine = s.qa.questions.filter(function (q) { return q.authorId === pid; });
    const feed = s.qa.questions
      .filter(function (q) { return q.authorId !== pid && (q.status === 'approved' || q.status === 'answered'); })
      .sort(function (a, b) { return b.votes - a.votes; });

    if (!s.event.qaOpen && tab === 'ask') {
      return html`<div class="wrap narrow"><div class="card center">
        <${U.Pill} tone="r">Q&R fermées</${U.Pill}>
        <h2 class="mt">Les questions sont closes</h2>
        <p class="muted mt-s">L'organisateur a fermé la prise de questions.</p>
      </div></div>`;
    }

    return html`<div class="wrap narrow col">
      <div class="tabs">
        <button class=${tab === 'ask' ? 'on' : ''} onClick=${function () { setTab('ask'); }}>Poser une question</button>
        <button class=${tab === 'mine' ? 'on' : ''} onClick=${function () { setTab('mine'); }}>Mes questions (${mine.length})</button>
        <button class=${tab === 'vote' ? 'on' : ''} onClick=${function () { setTab('vote'); }}>Voter (${feed.length})</button>
      </div>

      ${tab === 'ask' ? html`<div class="card glow">
        <${U.Pill} tone="v">Étape 1 · Destinataire</${U.Pill}>
        <h2 class="mt" style="font-size:20px">À quel intervenant s'adresse votre question ?</h2>
        <div class="col mt">
          ${s.intervenants.map(function (iv) {
            return html`<button key=${iv.id} class=${'opt' + (target === iv.id ? ' sel' : '')} onClick=${function () { setTarget(iv.id); }}>
              <${U.Avatar} p=${iv} size=${42} square=${true} />
              <span style="flex:1">
                <span style="display:block;font-weight:750">${iv.name}</span>
                <span class="tiny dim">${iv.role} · ${iv.company}</span>
              </span>
              ${target === iv.id ? html`<span style="color:var(--v);font-weight:900">✓</span>` : null}
            </button>`;
          })}
        </div>
        <div class="divider"></div>
        <${U.Pill} tone="v">Étape 2 · Votre question</${U.Pill}>
        <textarea class="input mt" maxlength="240" placeholder="Écrivez votre question…"
          value=${body} onInput=${function (e) { setBody(e.target.value); }}></textarea>
        <div class="row between mt-s">
          <span class="tiny dim">${body.length} / 240 caractères</span>
          <span class="tiny dim">Visible par l'organisateur avant diffusion</span>
        </div>
        <button class="btn primary block mt" disabled=${!target || body.trim().length < 6} onClick=${function () {
          const ivId = target, txt = body.trim();
          S.act('Participant', 'Nouvelle question pour ' + (s.intervenants.find(function (x) { return x.id === ivId; }) || {}).name, function (d) {
            d.qa.questions.unshift({
              id: 'qa-' + Date.now(), authorId: pid, intervenantId: ivId, body: txt,
              status: 'pending', votes: 0, createdAt: Date.now(), answeredAt: null
            });
          });
          setBody(''); setTarget(null); setSent(true);
          setTimeout(function () { setSent(false); }, 2600);
        }}>Envoyer ma question</button>
        ${sent ? html`<div class="note mt">Question envoyée. Elle sera transmise à l'intervenant après validation par l'organisateur.</div>` : null}
      </div>` : null}

      ${tab === 'mine' ? html`<div class="card">
        <div class="card-h"><div class="card-t">Mes questions</div></div>
        ${!mine.length ? html`<p class="muted small">Vous n'avez pas encore posé de question.</p>` : mine.map(function (q) {
          const iv = s.intervenants.find(function (x) { return x.id === q.intervenantId; });
          const st = STATUS[q.status];
          return html`<div key=${q.id} class=${'q ' + q.status} style="margin-bottom:10px">
            <div class="row between">
              <span class="tiny dim">→ ${iv ? iv.name : '—'}</span>
              <${U.Pill} tone=${st.tone}>${st.label}</${U.Pill}>
            </div>
            <div class="small mt-s">${q.body}</div>
          </div>`;
        })}
      </div>` : null}

      ${tab === 'vote' ? html`<div class="card">
        <div class="card-h"><div class="card-t">Soutenez les meilleures questions</div></div>
        <p class="muted small" style="margin-bottom:12px">Les questions les plus votées passent en priorité à l'antenne.</p>
        ${!feed.length ? html`<p class="muted small">Aucune question diffusée pour l'instant.</p>` : feed.map(function (q) {
          const iv = s.intervenants.find(function (x) { return x.id === q.intervenantId; });
          const a = S.participant(s, q.authorId);
          const voted = (q.voters || []).indexOf(pid) >= 0;
          return html`<div key=${q.id} class=${'q ' + (q.status === 'answered' ? 'answered' : 'hi')} style="margin-bottom:10px">
            <div class="row between">
              <span class="tiny dim">→ ${iv ? iv.name : '—'} · par ${a ? a.pseudo : 'anonyme'}</span>
              <button class=${'btn xs ' + (voted ? 'cyan' : '')} disabled=${voted || q.status === 'answered'} onClick=${function () {
                S.act('Participant', 'Vote sur une question', function (d) {
                  const qq = d.qa.questions.find(function (x) { return x.id === q.id; });
                  qq.voters = qq.voters || [];
                  if (qq.voters.indexOf(pid) < 0) { qq.voters.push(pid); qq.votes = (qq.votes || 0) + 1; }
                });
              }}>▲ ${q.votes}</button>
            </div>
            <div class="small mt-s">${q.body}</div>
          </div>`;
        })}
      </div>` : null}
    </div>`;
  }

  /* ------------------------ ÉCRAN ------------------------ */
  function QaScreen(props) {
    const s = props.s;
    const [syncedAt, setSyncedAt] = useState(Date.now());
    useEffect(function () { const t = setInterval(function () { setSyncedAt(Date.now()); }, 5000); return function () { clearInterval(t); }; }, []);
    const [ivId, setIvId] = useState(s.intervenants[0].id);
    const iv = s.intervenants.find(function (x) { return x.id === ivId; });
    const list = S.qaFor(s, ivId).filter(function (q) { return q.status === 'approved' || q.status === 'answered'; });
    const onAir = list.find(function (q) { return q.onAir === true; }) || list.find(function (q) { return q.status === 'approved'; });

    return html`<div class="screen">
      <div class="screen-head">
        <div class="row"><div class="logo">BTL</div><div>
          <div class="screen-title">Questions & Réponses</div>
          <div class="muted">${s.event.name} · Scannez pour poser votre question · synchro ${new Date(syncedAt).toLocaleTimeString('fr-FR')}</div>
        </div></div>
        <div class="row"><span class="tiny dim">sync scène · 5 s</span><${U.Pill} tone=${s.event.qaOpen ? 'g' : 'r'}>${s.event.qaOpen ? 'Questions ouvertes' : 'Questions closes'}</${U.Pill}></div>
      </div>

      <div style="display:grid;grid-template-columns:330px 1fr;gap:30px;flex:1">
        <div class="card flat center" style="align-self:start">
          <div class="tiny dim" style="font-weight:700;letter-spacing:.1em;margin-bottom:12px">SCANNEZ POUR PARTICIPER</div>
          <${U.QR} text=${qaUrl()} size=${258} />
          <div class="mono small mt" style="font-weight:700">${qaUrl().replace(/^https?:\/\//, '')}</div>
          <div class="note mt">Choisissez l'intervenant destinataire, puis rédigez votre question.</div>
        </div>

        <div>
          <div class="tabs" style="margin-bottom:16px">
            ${s.intervenants.map(function (x) {
              return html`<button key=${x.id} class=${ivId === x.id ? 'on' : ''} onClick=${function () { setIvId(x.id); }}>
                ${x.name} · ${S.qaFor(s, x.id).filter(function (q) { return q.status !== 'rejected'; }).length}
              </button>`;
            })}
          </div>

          <div class="row" style="gap:16px;margin-bottom:18px">
            <${U.Avatar} p=${iv} size=${64} square=${true} ring=${true} />
            <div>
              <div class="screen-title" style="font-size:28px">${iv.name}</div>
              <div class="muted">${iv.role} · ${iv.company}</div>
            </div>
          </div>

          ${onAir ? html`<div class="screen-cta" style="margin-bottom:16px">
            <span class="live-dot" style="width:12px;height:12px"></span>
            <div>
              <div class="row"><${U.Avatar} p=${S.participant(s, onAir.authorId)} size=${46} /><div><div class="tiny" style="font-weight:800;letter-spacing:.1em">À L'ANTENNE · ${onAir.votes} votes</div>
              <div style="font-size:clamp(17px,1.7vw,25px);font-weight:700;line-height:1.25;margin-top:4px">${onAir.body}</div></div></div>
          </div>` : null}

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
            ${list.filter(function (q) { return q !== onAir; }).slice(0, 6).map(function (q, i) {
              const a = S.participant(s, q.authorId);
              return html`<div key=${q.id} class=${'q ' + (q.status === 'answered' ? 'answered' : '')}>
                <div class="row between">
                  <span class="tiny dim">#${i + 2} · ${a ? a.pseudo : 'anonyme'}</span>
                  <span class="pill k">▲ ${q.votes}</span>
                </div>
                <div class="small mt-s">${q.body}</div>
              </div>`;
            })}
          </div>
          ${!list.length ? html`<p class="muted">Aucune question retenue pour cet intervenant.</p>` : null}
        </div>
      </div>
    </div>`;
  }

  /* ------------------------ INTERVENANT ------------------------ */
  function QaIntervenant(props) {
    const s = props.s, me = props.me;
    const ivId = me.intervenantId;
    const iv = s.intervenants.find(function (x) { return x.id === ivId; });
    const list = S.qaFor(s, ivId).filter(function (q) { return q.status === 'approved' || q.status === 'answered'; });

    return html`<div class="wrap mid col">
      <div class="row between wrap-row">
        <div class="row">
          <${U.Avatar} p=${iv} size=${54} square=${true} ring=${true} />
          <div>
            <h1 style="font-size:23px">${iv.name}</h1>
            <p class="muted small">${iv.role} · ${iv.company}</p>
          </div>
        </div>
        <${U.Pill} tone="c">${list.length} question(s) retenue(s)</${U.Pill}>
      </div>

      <div class="note">Vue intervenant : vous ne voyez que les questions qui vous sont destinées et validées par l'organisateur. Triez par votes, marquez celles traitées.</div>

      ${!list.length ? html`<div class="card center muted">Aucune question pour le moment.</div>` : list.map(function (q, i) {
        const a = S.participant(s, q.authorId);
        return html`<div key=${q.id} class=${'q ' + (q.status === 'answered' ? 'answered' : 'hi')}>
          <div class="row between">
            <span class="tiny dim">${i + 1} · posée par ${a ? a.pseudo : 'anonyme'} · ${S.timeAgo(q.createdAt)}</span>
            <span class="pill v">▲ ${q.votes} votes</span>
          </div>
          <div class="mt-s" style="font-size:16px;font-weight:600;line-height:1.4">${q.body}</div>
          <div class="row mt">
            ${q.status === 'answered'
              ? html`<${U.Pill} tone="g">Répondue</${U.Pill}>`
              : html`<button class="btn xs green" onClick=${function () {
                  S.act('Intervenant', iv.name + ' a répondu à une question', function (d) {
                    const qq = d.qa.questions.find(function (x) { return x.id === q.id; });
                    qq.status = 'answered'; qq.answeredAt = Date.now();
                  });
                }}>Marquer comme répondue</button>`}
            <button class="btn xs" onClick=${function () {
              S.act('Intervenant', "Mise à l'antenne d'une question", function (d) {
                d.qa.questions.forEach(function (x) { if (x.intervenantId === ivId && x.status === 'approved') x.onAir = false; });
                const qq = d.qa.questions.find(function (x) { return x.id === q.id; });
                qq.onAir = true;
              });
            }}>Mettre à l'antenne</button>
          </div>
        </div>`;
      })}
    </div>`;
  }

  /* ------------------------ ORGANISATEUR ------------------------ */
  function QaAdmin(props) {
    const s = props.s;
    const [filter, setFilter] = useState('pending');
    const all = s.qa.questions.slice().sort(function (a, b) { return (b.votes - a.votes) || (b.createdAt - a.createdAt); });
    const list = filter === 'all' ? all : all.filter(function (q) { return q.status === filter; });

    function setStatus(id, status) {
      S.act('Organisateur', 'Question ' + (status === 'approved' ? 'validée' : status === 'rejected' ? 'écartée' : 'traitée'), function (d) {
        const q = d.qa.questions.find(function (x) { return x.id === id; });
        q.status = status;
        if (status === 'answered') q.answeredAt = Date.now();
      });
    }

    return html`<div class="wrap col">
      <div class="row between wrap-row">
        <div>
          <h1 style="font-size:26px">Modération des questions</h1>
          <p class="muted small">Validez, écartez ou marquez comme traitées les questions reçues par QR code.</p>
        </div>
        <button class=${'btn ' + (s.event.qaOpen ? 'danger' : 'green')} onClick=${function () {
          S.act('Organisateur', s.event.qaOpen ? 'Fermeture des Q&R' : 'Ouverture des Q&R', function (d) { d.event.qaOpen = !d.event.qaOpen; });
        }}>${s.event.qaOpen ? 'Fermer les questions' : 'Ouvrir les questions'}</button>
      </div>

      <div class="grid g4 mt">
        <${U.Stat} k="Reçues" v=${all.length} />
        <${U.Stat} k="En attente" v=${all.filter(function (q) { return q.status === 'pending'; }).length} color="var(--amber)" />
        <${U.Stat} k="Retenues" v=${all.filter(function (q) { return q.status === 'approved'; }).length} color="var(--c)" />
        <${U.Stat} k="Traitées" v=${all.filter(function (q) { return q.status === 'answered'; }).length} color="var(--green)" />
      </div>

      <div class="tabs mt">
        ${[['pending', 'En attente'], ['approved', 'Retenues'], ['answered', 'Traitées'], ['rejected', 'Écartées'], ['all', 'Toutes']].map(function (t) {
          return html`<button key=${t[0]} class=${filter === t[0] ? 'on' : ''} onClick=${function () { setFilter(t[0]); }}>${t[1]}</button>`;
        })}
      </div>

      <div class="col mt">
        ${!list.length ? html`<div class="card center muted">Aucune question dans ce filtre.</div>` : list.map(function (q) {
          const a = S.participant(s, q.authorId);
          const iv = s.intervenants.find(function (x) { return x.id === q.intervenantId; });
          return html`<div key=${q.id} class=${'q ' + q.status}>
            <div class="row between wrap-row">
              <div class="row" style="gap:9px">
                <${U.Avatar} p=${a} size=${30} />
                <span class="small" style="font-weight:650">${a ? a.pseudo : 'anonyme'}</span>
                <span class="tiny dim">${S.timeAgo(q.createdAt)}</span>
              </div>
              <div class="row" style="gap:8px">
                <span class="pill v">▲ ${q.votes}</span>
                <${U.Pill} tone=${STATUS[q.status].tone}>${STATUS[q.status].label}</${U.Pill}>
              </div>
            </div>
            <div class="mt-s" style="font-size:15.5px;line-height:1.45">${q.body}</div>
            <div class="row between wrap-row mt">
              <div class="row" style="gap:8px">
                <${U.Avatar} p=${iv} size=${26} square=${true} />
                <span class="tiny dim">→ ${iv ? iv.name : '—'}</span>
              </div>
              <div class="row" style="gap:8px">
                <button class="btn xs green" disabled=${q.status === 'approved'} onClick=${function () { setStatus(q.id, 'approved'); }}>Valider</button>
                <button class="btn xs cyan" disabled=${q.status === 'answered'} onClick=${function () { setStatus(q.id, 'answered'); }}>Traitée</button>
                <button class="btn xs danger" disabled=${q.status === 'rejected'} onClick=${function () { setStatus(q.id, 'rejected'); }}>Écarter</button>
              </div>
            </div>
          </div>`;
        })}
      </div>
    </div>`;
  }

  BTL.modQa = { QaParticipant, QaScreen, QaIntervenant, QaAdmin, qaUrl };
})();

</script>
<script>
/* ============================================================
   BTL Live — Module SLIDES
   deck événementiel, pilotage intervenant, projection synchronisée
   ============================================================ */
window.BTL = window.BTL || {};
(function () {
  const html = BTL.html;
  const { useState, useEffect, useRef } = BTL.hooks;
  const S = BTL.store;
  const U = BTL.ui;

  function deckOf(s) {
    return s.event.slideDeck || { name: 'Aucun deck', slides: [] };
  }

  function SlideVisual(props) {
    const slide = props.slide;
    if (!slide) return html`<div class="slide-preview"><div class="muted">Aucune slide disponible.</div></div>`;
    return html`<div class=${props.scene ? 'scene-slide' : 'slide-preview'} style=${{ '--slide-accent': slide.accent }}>
      <div class="slide-copy">
