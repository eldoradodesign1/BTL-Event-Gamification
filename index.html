        <div class="slide-kicker">${slide.kicker}</div>
        <h2>${slide.title}</h2>
        <p>${slide.body}</p>
        <div class="bar mt-l"><i style=${{ width: '38%', background: 'linear-gradient(90deg,' + slide.accent + ',var(--c))' }}></i></div>
      </div>
    </div>`;
  }

  function SlideDeck(props) {
    const s = props.s;
    const deck = deckOf(s);
    const [open, setOpen] = useState(Math.max(0, s.event.currentSlide || 0));
    const fileRef = useRef(null);
    const active = Math.max(0, Math.min(deck.slides.length - 1, s.event.currentSlide || 0));
    useEffect(function () { setOpen(active); }, [active]);

    function go(index) {
      const next = Math.max(0, Math.min(deck.slides.length - 1, index));
      setOpen(next);
      S.act('Intervenant', 'Slide ' + (next + 1) + ' affichée', function (d) { d.event.currentSlide = next; });
    }
    async function upload(e) {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      try {
        const JSZip = (await import('https://esm.sh/jszip@3.10.1?bundle')).default;
        const zip = await JSZip.loadAsync(await f.arrayBuffer());
        const names = Object.keys(zip.files).filter(function (name) { return /^ppt\/slides\/slide\d+\.xml$/.test(name); }).sort(function (a, b) { return Number(a.match(/\d+/)[0]) - Number(b.match(/\d+/)[0]); });
        const slides = [];
        for (let i = 0; i < names.length; i += 1) {
          const xml = await zip.files[names[i]].async('text');
          const texts = Array.from(xml.matchAll(/<a:t[^>]*>([\s\S]*?)<\/a:t>/g)).map(function (m) { return m[1].replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>'); }).filter(Boolean);
          slides.push({ id: 'uploaded-' + (i + 1), kicker: 'PPTX IMPORTÉ · ' + String(i + 1).padStart(2, '0'), title: texts[0] || 'Slide ' + (i + 1), body: texts.slice(1).join(' · ') || 'Slide importée depuis ' + f.name, accent: ['#7C5CFF','#22D3EE','#FFB020','#34D399'][i % 4] });
        }
        S.act('Intervenant', 'Deck PPTX renseigné', function (d) {
          d.event.slideDeck.name = f.name;
          d.event.slideDeck.uploaded = true;
          d.event.slideDeck.updatedAt = Date.now();
          if (slides.length) { d.event.slideDeck.slides = slides; d.event.currentSlide = 0; }
        });
      } catch (error) {
        S.act('Intervenant', 'PPTX renseigné — aperçu de démonstration conservé', function (d) { d.event.slideDeck.name = f.name; d.event.slideDeck.uploaded = true; d.event.slideDeck.updatedAt = Date.now(); });
      }
    }

    return html`<div class="wrap col">
      <div class="row between wrap-row">
        <div>
          <${U.Pill} tone="c">Espace intervenant</${U.Pill}>
          <h1 class="mt" style="font-size:26px">Slides & scène</h1>
          <p class="muted small mt-s">Pilotez votre support et la slide projetée est synchronisée automatiquement toutes les 5 secondes.</p>
        </div>
        <div class="row">
          <input ref=${fileRef} type="file" accept=".pptx,application/vnd.openxmlformats-officedocument.presentationml.presentation" class="hide" onChange=${upload} />
          <button class="btn sm" onClick=${function () { if (fileRef.current) fileRef.current.click(); }}>Renseigner un PPTX</button>
          <a class="btn sm primary" href="#/screen/slides">Ouvrir la scène</a>
        </div>
      </div>
      <div class="note">Deck actif : <b>${deck.name}</b> · ${deck.uploaded ? 'fichier renseigné' : 'aperçu de démonstration'} · durée d’accès intervenant liée à l’Event.</div>
      <div class="slide-layout">
        <div class="col">
          <${SlideVisual} slide=${deck.slides[open]} />
          <div class="row between">
            <button class="btn xs" disabled=${open <= 0} onClick=${function () { go(open - 1); }}>← Précédente</button>
            <span class="tiny dim mono">Slide ${open + 1} / ${deck.slides.length}</span>
            <button class="btn xs" disabled=${open >= deck.slides.length - 1} onClick=${function () { go(open + 1); }}>Suivante →</button>
          </div>
        </div>
        <div class="slide-thumbs">
          ${deck.slides.map(function (slide, i) { return html`<button key=${slide.id} class=${'slide-thumb ' + (i === open ? 'on' : '')} onClick=${function () { go(i); }}><b>${i + 1}</b><span>${slide.title}</span></button>`; })}
        </div>
      </div>
    </div>`;
  }

  function SlideScreen(props) {
    const s = props.s;
    const deck = deckOf(s);
    const [tick, setTick] = useState(Date.now());
    useEffect(function () { const t = setInterval(function () { setTick(Date.now()); }, 5000); return function () { clearInterval(t); }; }, []);
    const active = deck.slides[Math.max(0, Math.min(deck.slides.length - 1, s.event.currentSlide || 0))];
    return html`<div class="screen">
      <div class="screen-head">
        <div class="row"><div class="logo">BTL</div><div><div class="screen-title">${s.event.name}</div><div class="muted">Intervention · ${deck.name}</div></div></div>
        <div class="row"><${U.QR} text=${location.origin + location.pathname + '?view=join&module=slides'} size=${104} /><${U.Pill} tone="g">● Scène synchronisée</${U.Pill}><span class="tiny dim">sync ${new Date(tick).toLocaleTimeString('fr-FR')}</span></div>
      </div>
      <div style="flex:1;display:grid;place-items:center"><${SlideVisual} slide=${active} scene=${true} /></div>
      <div class="row between mt"><span class="tiny dim">Slide ${Math.max(1, (s.event.currentSlide || 0) + 1)} / ${deck.slides.length}</span><a class="btn xs" href="#/screen/qa">Passer aux Q/R</a></div>
    </div>`;
  }

  BTL.modSlides = { SlideDeck, SlideScreen };
})();
</script>
<script>
/* ============================================================
   BTL Live — Vues transverses (accueil, rejoindre, tableau de bord)
   ============================================================ */
window.BTL = window.BTL || {};
(function () {
  const html = BTL.html;
  const { useState } = BTL.hooks;
  const S = BTL.store;
  const U = BTL.ui;

  function joinUrl(moduleName) { return location.origin + location.pathname + '?view=join&module=' + (moduleName || 'entry'); }

  const ROLES = [
    { key: 'participant', ic: '📱', title: 'Participant', desc: "Rejoint l'événement, répond au quiz, s'inscrit à la tombola, pose ses questions par QR code.", route: '#/join' },
    { key: 'organisateur', ic: '🎛️', title: 'Organisateur', desc: 'Pilote les trois modules en direct : lance les questions, déclenche le tirage, modère les questions.', route: '#/admin/quiz' },
    { key: 'intervenant', ic: '🎤', title: 'Intervenant', desc: 'Consulte uniquement les questions qui lui sont destinées, triées par votes, et les marque comme traitées.', route: '#/iv' },
    { key: 'ecran', ic: '🖥️', title: 'Écran / projection', desc: 'Affichage grand écran : compte à rebours, réponses en direct, tirage animé, QR code des questions.', route: '#/screen/quiz' }
  ];

  function Landing(props) {
    const s = props.s;
    return html`<div class="wrap">
      <div class="hero">
        <div class="row" style="justify-content:center;gap:9px">
          <span class="live-dot"></span>
          <span class="tiny" style="font-weight:700;letter-spacing:.12em;color:var(--muted)">ÉVÉNEMENT EN DIRECT · ${s.event.code}</span>
        </div>
        <h1 class="mt">${s.event.name}</h1>
        <p class="muted mt" style="max-width:640px;margin:14px auto 0;font-size:16px;line-height:1.6">
          Plateforme de gamification de conférence signée <b style="color:var(--txt)">BTL</b> — quiz interactif, tombola animée
          et questions/réponses par QR code, sur un seul dispositif.
        </p>
        <div class="row mt-l" style="justify-content:center;gap:10px;flex-wrap:wrap">
          <${U.Pill} tone="v">${s.participants.length} participants</${U.Pill}>
          <${U.Pill} tone="c">${s.quiz.questions.length} questions</${U.Pill}>
          <${U.Pill} tone="a">${S.tombolaPool(s).length} tickets tombola</${U.Pill}>
          <${U.Pill} tone="g">${s.qa.questions.length} questions posées</${U.Pill}>
        </div>
      </div>

      <div class="grid g2 mt-l">
        ${ROLES.map(function (r) {
          return html`<button key=${r.key} class="rolecard" onClick=${function () { location.hash = r.route; }}>
            <div class="ic">${r.ic}</div>
            <div style="font-family:var(--fd);font-weight:750;font-size:19px">${r.title}</div>
            <div class="muted small" style="line-height:1.5">${r.desc}</div>
            <div class="tiny" style="color:var(--v);font-weight:700">Ouvrir →</div>
          </button>`;
        })}
      </div>

      <div class="note mt-l">
        Ébauche de démonstration — données fictives. L'état est partagé en temps réel entre les onglets ouverts (ouvrez l'écran dans un onglet,
        le pilotage dans un autre). Le branchement Supabase (participants, questions, réponses, tirages) est prévu dans la couche <span class="kbd">store.js</span>.
      </div>
    </div>`;
  }

  function Join(props) {
    const s = props.s;
    const [pseudo, setPseudo] = useState('');
    const [code, setCode] = useState(s.event.code);
    const [photo, setPhoto] = useState(null);
    const fileRef = BTL.hooks.useRef(null);

    function pickFile(e) {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = function () { setPhoto(r.result); };
      r.readAsDataURL(f);
    }

    return html`<div class="wrap narrow col">
      <div class="card glow">
        <${U.Pill} tone="v">Rejoindre l'événement</${U.Pill}>
        <h2 class="mt" style="font-size:24px">${s.event.name}</h2>
        <p class="muted small mt-s">${s.event.client} · ${s.event.venue}</p>
        <div class="note mt-s">Compte participant éphémère · conservation prévue ${s.event.participantTtlDays || 2} jours.</div>
        <label class="label mt">Code de l'événement</label>
        <input class="input mono" value=${code} onInput=${function (e) { setCode(e.target.value); }} />
        <label class="label mt">Votre nom affiché</label>
        <input class="input" placeholder="ex. Nadia B." value=${pseudo} onInput=${function (e) { setPseudo(e.target.value); }} />
        <label class="label mt">Photo de badge <span class="dim">(facultatif)</span></label>
        <div class="row">
          <${U.Avatar} p=${{ pseudo: pseudo || '?', photo: photo }} size=${56} ring=${true} />
          <button class="btn sm" onClick=${function () { if (fileRef.current) fileRef.current.click(); }}>Choisir une photo</button>
          <input ref=${fileRef} type="file" accept="image/*" class="hide" onChange=${pickFile} />
        </div>
        <button class="btn primary block mt-l" disabled=${pseudo.trim().length < 2} onClick=${function () {
          const id = 'p-' + Math.random().toString(36).slice(2, 7);
          const name = pseudo.trim();
          S.update(function (d) {
            let n;
            const used = d.participants.map(function (p) { return p.number; });
            do { n = 1000 + Math.floor(Math.random() * 900); } while (used.indexOf(n) >= 0);
            d.participants.push({ id: id, pseudo: name, photo: photo, number: n, tombola: false, expiresAt: Date.now() + (d.event.participantTtlDays || 2) * 86400000 });
          });
          S.setMe({ role: 'participant', participantId: id, pseudo: name });
          location.hash = '#/p/quiz';
        }}>Entrer dans l'événement</button>
      </div>
    </div>`;
  }

  function AdminHome(props) {
    const s = props.s;
    const lb = S.leaderboard(s);
    return html`<div class="wrap col">
      <div class="row between wrap-row">
        <div>
          <h1 style="font-size:26px">Tableau de bord</h1>
          <p class="muted small">${s.event.name} · ${s.event.client} · ${s.event.venue}</p>
        </div>
        <div class="row">
          <${U.Pill} tone="g">● En direct</${U.Pill}>
          <button class="btn sm" onClick=${function () { location.hash = '#/screen/quiz'; }}>Ouvrir l'écran</button>
        </div>
      </div>

      <div class="grid g4 mt">
        <${U.Stat} k="Participants" v=${s.participants.length} />
        <${U.Stat} k="Réponses quiz" v=${s.quiz.answers.length} color="var(--c)" />
        <${U.Stat} k="Tickets tombola" v=${S.tombolaPool(s).length} color="var(--pink)" />
        <${U.Stat} k="Questions à modérer" v=${S.pendingCount(s)} color="var(--amber)" />
      </div>

      <div class="grid g3 mt">
        <button class="rolecard" onClick=${function () { location.hash = '#/admin/quiz'; }}>
          <div class="ic">🧠</div><div style="font-family:var(--fd);font-weight:750;font-size:18px">Quiz</div>
          <div class="muted small">Question ${s.quiz.currentIndex + 1} / ${s.quiz.questions.length} · statut « ${s.quiz.status} »</div>
        </button>
        <button class="rolecard" onClick=${function () { location.hash = '#/admin/tombola'; }}>
          <div class="ic">🎟️</div><div style="font-family:var(--fd);font-weight:750;font-size:18px">Tombola</div>
          <div class="muted small">${S.tombolaPool(s).length} inscrits · ${s.tombola.history.length} tirage(s)</div>
        </button>
        <button class="rolecard" onClick=${function () { location.hash = '#/admin/qa'; }}>
          <div class="ic">💬</div><div style="font-family:var(--fd);font-weight:750;font-size:18px">Questions / Réponses</div>
          <div class="muted small">${S.pendingCount(s)} en attente · ${s.event.qaOpen ? 'ouvertes' : 'fermées'}</div>
        </button>
      </div>

      <div class="grid g3 mt">
        <div class="card"><div class="card-h"><div class="card-t">Intervenants actifs</div><span class="spacer"></span><span class="pill c">${s.intervenants.length}</span></div>
          ${s.intervenants.map(function (iv) { return html`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--stroke)"><${U.Avatar} p=${iv} size=${32} square=${true} /><div><div class="small" style="font-weight:700">${iv.name}</div><div class="tiny dim">${iv.role}</div></div></div>`; })}
          <div class="tiny dim mt-s">Accès événement jusqu’au ${new Date(s.event.intervenantExpiresAt).toLocaleDateString('fr-FR')}</div>
        </div>
        <div class="card"><div class="card-h"><div class="card-t">Présence salle</div></div><div class="big huge grad">${s.participants.length}</div><div class="muted small mt-s">participants éphémères actifs</div><div class="bar mt"><i style=${{ width: '78%' }}></i></div><div class="tiny dim mt-s">${S.tombolaPool(s).length} inscrits tombola · ${s.quiz.answers.length} réponses quiz</div></div>
        <div class="card"><div class="card-h"><div class="card-t">Deck scène</div></div><div class="pill v">${s.event.slideDeck && s.event.slideDeck.uploaded ? 'PPTX renseigné' : 'Aperçu démo'}</div><div class="small mt-s" style="font-weight:700">${s.event.slideDeck ? s.event.slideDeck.name : 'Aucun deck'}</div><div class="tiny dim mt-s">Slide courante : ${(s.event.currentSlide || 0) + 1} · synchro 5 s</div><a class="btn xs mt" href="#/screen/slides">Voir la scène</a></div>
      </div>

      <div class="grid g2 mt">
        <div class="card">
          <div class="card-h"><div class="card-t">Classement général</div></div>
          <div class="scroll">${lb.slice(0, 12).map(function (r, i) { return html`<${U.RankRow} key=${r.id} r=${r} i=${i} />`; })}</div>
        </div>
        <div class="card">
          <div class="card-h"><div class="card-t">Journal d'activité</div></div>
          <div class="scroll">
            ${(s.logs || []).map(function (l) {
              return html`<div key=${l.id} class="row between" style="padding:8px 0;border-bottom:1px solid var(--stroke)">
                <div><div class="small" style="font-weight:650">${l.what}</div><div class="tiny dim">${l.who}</div></div>
                <div class="tiny dim">${S.timeAgo(l.at)}</div>
              </div>`;
            })}
          </div>
        </div>
      </div>
    </div>`;
  }

  function IvPicker(props) {
    const s = props.s;
    return html`<div class="wrap narrow">
      <div class="card">
        <${U.Pill} tone="c">Accès intervenant</${U.Pill}>
        <h2 class="mt" style="font-size:22px">Qui êtes-vous ?</h2>
        <p class="muted small mt-s">En production, l'accès se fait par lien signé ou code personnel envoyé à l'intervenant.</p>
        <div class="col mt">
          ${s.intervenants.map(function (iv) {
            return html`<button key=${iv.id} class="opt" onClick=${function () {
              S.setMe({ role: 'intervenant', intervenantId: iv.id });
              location.hash = '#/iv/' + iv.id;
            }}>
              <${U.Avatar} p=${iv} size=${44} square=${true} />
              <span style="flex:1"><span style="display:block;font-weight:750">${iv.name}</span>
              <span class="tiny dim">${iv.role} · ${iv.company}</span></span>
            </button>`;
          })}
        </div>
      </div>
    </div>`;
  }

  BTL.views = { Landing, Join, AdminHome, IvPicker, ROLES };
})();

</script>
<script>
/* ============================================================
   BTL Live — Application : routage par rôle + coquille
   ============================================================ */
window.BTL = window.BTL || {};
(function () {
  const html = BTL.html;
  const { useState, useEffect } = BTL.hooks;
  const S = BTL.store;
  const U = BTL.ui;
  const V = BTL.views;

  function useStore() {
    const [s, setS] = useState(S.get());
    useEffect(function () { return S.subscribe(setS); }, []);
    return s;
  }

  function useRoute() {
    const [hash, setHash] = useState(location.hash || '#/');
    useEffect(function () {
      const f = function () { setHash(location.hash || '#/'); };
      window.addEventListener('hashchange', f);
      return function () { window.removeEventListener('hashchange', f); };
    }, []);
    return hash;
  }

  function parse(hash) {
    const raw = hash.replace(/^#\/?/, '');
    const parts = raw.split('?');
    const seg = parts[0].split('/').filter(Boolean);
    const q = {};
    (parts[1] || '').split('&').filter(Boolean).forEach(function (kv) {
      const p = kv.split('='); q[p[0]] = decodeURIComponent(p[1] || '');
    });
    return { seg: seg, q: q };
  }

  function Topbar(props) {
    const me = props.me, route = props.route;
    const [accessOpen, setAccessOpen] = useState(false);
    const [resetOpen, setResetOpen] = useState(false);
    const tabs = me && me.role === 'organisateur'
      ? [['#/admin', 'Tableau de bord'], ['#/admin/quiz', 'Quiz'], ['#/admin/tombola', 'Tombola'], ['#/admin/qa', 'Q&R']]
      : me && me.role === 'intervenant'
        ? [['#/iv/' + me.intervenantId, 'Mes questions'], ['#/iv/' + me.intervenantId + '/slides', 'Mes slides']]
        : [['#/p/quiz', 'Quiz'], ['#/p/tombola', 'Tombola'], ['#/p/qa', 'Questions']];

    function switchRole(v) {
      if (v === 'participant') { S.setMe({ role: 'participant', participantId: 'p-11' }); location.hash = '#/p/quiz'; }
      else if (v === 'organisateur') { S.setMe({ role: 'organisateur' }); location.hash = '#/admin'; }
      else if (v === 'intervenant') { S.setMe({ role: 'intervenant', intervenantId: 'iv-1' }); location.hash = '#/iv/iv-1'; }
      else if (v === 'ecran') { location.hash = '#/screen/quiz'; }
      else { S.setMe(null); location.hash = '#/'; }
    }

    return html`<div class="topbar"><div class="topbar-in">
      <a class="brand" href="#/"><span class="logo">BTL</span><span>Live</span></a>
      <div class="nav">
        ${tabs.map(function (t) {
          const on = route.indexOf(t[0]) === 0 && (t[0] !== '#/admin' || route === '#/admin');
          return html`<a key=${t[0]} href=${t[0]} class=${on ? 'on' : ''}>${t[1]}</a>`;
        })}
      </div>
      <div class="spacer"></div>
      <div class="row" style="gap:8px">
        <span class="live-dot"></span>
        <div class="access-menu">
          <button class="access-trigger" onClick=${function () { setAccessOpen(function (v) { return !v; }); }}><span class="live-dot"></span><span>${me ? (me.role === 'organisateur' ? 'Organisateur' : me.role === 'intervenant' ? 'Intervenant' : 'Participant') : 'Choisir un accès'}</span><span class="chevron">⌄</span></button>
          ${accessOpen ? html`<div class="access-popover">
            ${[['participant','📱 Participant'],['organisateur','🎛️ Organisateur'],['intervenant','🎤 Intervenant'],['ecran','🖥️ Écran']].map(function (item) { return html`<button key=${item[0]} onClick=${function () { setAccessOpen(false); switchRole(item[0]); }}>${item[1]}</button>`; })}
            ${me && me.role === 'organisateur' ? html`<button class="access-danger" onClick=${function () { setAccessOpen(false); if (window.BTLAccess && window.BTLAccess.signOut) window.BTLAccess.signOut(); else switchRole('none'); }}>↪ Se déconnecter</button>` : null}
          </div>` : null}
        </div>
        <div class="access-menu">
          <button class="btn xs ghost" title="Réinitialiser la démo" onClick=${function () { setResetOpen(function (v) { return !v; }); }}>↺</button>
          ${resetOpen ? html`<div class="access-popover" style="min-width:240px"><div class="tiny" style="padding:5px 8px 8px;color:var(--muted)">Réinitialiser la démo ?</div><button onClick=${function () { setResetOpen(false); S.reset(); S.setMe(null); location.hash = '#/'; }}>Réinitialiser les données</button><button class="access-danger" onClick=${function () { setResetOpen(false); }}>Annuler</button></div>` : null}
        </div>
      </div>
    </div></div>`;
  }

  function ScreenBar() {
    return html`<div class="topbar"><div class="topbar-in">
      <div class="brand"><span class="logo">BTL</span><span>Live · mode écran</span></div>
      <div class="spacer"></div>
      <div class="nav">
        <a href="#/screen/quiz">Quiz</a>
        <a href="#/screen/tombola">Tombola</a>
        <a href="#/screen/qa">Questions</a>
        <a href="#/screen/slides">Slides</a>
      </div>
      <a class="btn xs" href="#/">Quitter</a>
    </div></div>`;
  }

  function App() {
    const s = useStore();
    const route = useRoute();
    const [me, setMeState] = useState(S.me());

    const p = parse(route);

    // Permet d'ouvrir directement une vue avec une identité : #/p/quiz?as=p-11
    useEffect(function () {
      const as = p.q.as;
      if (!as) return;
      if (as.indexOf('iv-') === 0) { S.setMe({ role: 'intervenant', intervenantId: as }); setMeState(S.me()); }
      else if (as.indexOf('p-') === 0) { S.setMe({ role: 'participant', participantId: as }); setMeState(S.me()); }
    }, [route]);

    useEffect(function () { setMeState(S.me()); }, [route]);

    const seg = p.seg;
    const isScreen = seg[0] === 'screen';

    let view = null;

    if (isScreen) {
      const mod = seg[1] || 'quiz';
      view = mod === 'tombola' ? html`<${BTL.modTombola.TombolaScreen} s=${s} />`
        : mod === 'qa' ? html`<${BTL.modQa.QaScreen} s=${s} />`
          : mod === 'slides' ? html`<${BTL.modSlides.SlideScreen} s=${s} />`
            : html`<${BTL.modQuiz.QuizScreen} s=${s} />`;
      return html`<div>${html`<${ScreenBar} />`}${view}</div>`;
    }

    if (seg[0] === 'join') view = html`<${V.Join} s=${s} />`;
    else if (seg[0] === 'admin') {
      const sub = seg[1];
      view = sub === 'quiz' ? html`<${BTL.modQuiz.QuizAdmin} s=${s} />`
        : sub === 'tombola' ? html`<${BTL.modTombola.TombolaAdmin} s=${s} />`
          : sub === 'qa' ? html`<${BTL.modQa.QaAdmin} s=${s} />`
            : html`<${V.AdminHome} s=${s} />`;
    } else if (seg[0] === 'iv') {
      const id = seg[1] || (me && me.intervenantId);
      view = id ? (seg[2] === 'slides' ? html`<${BTL.modSlides.SlideDeck} s=${s} me=${{ role: 'intervenant', intervenantId: id }} />` : html`<${BTL.modQa.QaIntervenant} s=${s} me=${{ role: 'intervenant', intervenantId: id }} />`) : html`<${V.IvPicker} s=${s} />`;
    } else if (seg[0] === 'p') {
      if (!me || me.role !== 'participant' || !S.participant(s, me.participantId)) {
        view = html`<${V.Join} s=${s} />`;
      } else {
        const sub = seg[1];
        view = sub === 'tombola' ? html`<${BTL.modTombola.TombolaParticipant} s=${s} me=${me} />`
          : sub === 'qa' ? html`<${BTL.modQa.QaParticipant} s=${s} me=${me} />`
            : html`<${BTL.modQuiz.QuizParticipant} s=${s} me=${me} />`;
      }
    } else {
      view = html`<${V.Landing} s=${s} />`;
    }

    return html`<div>${html`<${Topbar} me=${me} route=${route} />`}${view}</div>`;
  }

  BTL.store.boot();
  BTL.mount = function () {
    preact.render(html`<${App} />`, document.getElementById('app'));
  };
  BTL.mount();
})();

</script>
